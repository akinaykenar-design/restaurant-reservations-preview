<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Book a table — Preview</title>
<meta name="theme-color" content="#E9E6DF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2333352F' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='5' width='18' height='16' rx='3'/%3E%3Cpath d='M3 10h18M8 3v4M16 3v4'/%3E%3C/svg%3E">

<style>
/* ─────────────────────────────────────────────────────────────────────────────
   Restaurant Reservations — the look, one file.

   This is the POS's design system worn by the front desk: the same tokens,
   the same laws (DESIGN.md in restaurant-pos: Deck, Chip, Popup, Row, Border,
   Spacing, Dark mode, the finger law), so a waiter moving between the till
   and the bookings screen never re-learns anything.

   THE MAP:  grep -n '§§' public/style.css
   ───────────────────────────────────────────────────────────────────────────── */

/* Fonts ship WITH the app — no internet fetch, identical glyphs on every
   machine. Noto Sans is one variable file; Plex Mono carries the numbers. */
@font-face{font-family:'Noto Sans';font-style:normal;font-weight:100 900;font-display:swap;src:url('../fonts/notosans-var.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('../fonts/plexmono-500.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:swap;src:url('../fonts/plexmono-700.woff2') format('woff2');}

/* §§ Palette — :root is LIGHT, body[data-theme="dark"] is DARK. Literals on
   purpose (see the POS: a var() inside a token resolves where declared). */
:root{
  --font-body:'Noto Sans',-apple-system,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono','Noto Sans',monospace;
  --steel-100:#E9E6DF; --steel-200:#E2DED7; --steel-300:#D3CFC6; --steel-500:#B3ADA0;
  --charcoal:#23211D; --charcoal-soft:#918E88;
  --orange:#2F74C9; --orange-dim:color-mix(in srgb, var(--orange) 12%, var(--surface));
  --pick-wash:color-mix(in srgb, var(--orange) 6%, var(--surface));
  --green:#4FA51D; --green-dim:color-mix(in srgb, var(--green) 13%, var(--surface));
  --red:#A8483A; --red-btn:#D2604F; --gold:#C08A00; --teal:#0E9E8A; --violet:#6D4FC4;
  --deck-chip-bg:#E0DBCE; --deck-chip-line:#3A4149; --deck-chip-ink:#3A3833;
  --deck-chip-on-bg:#2E343B; --deck-chip-on-ink:#ffffff;
  /* CHROME: the ground of the bar across the top and the rail down the left.
     One token because they are one thing — the frame around the work — and a
     frame drawn in two colours is two frames. Light already had the rail on
     this exact value; the BAR is what moves onto it, off the paper it shared
     with the book. */
  --chrome:#E2DED7;
  /* THE BAR IS NOT THE RAIL ANY MORE. They were one token while the bar ran
     across the top of the rail and the two read as one frame. The rail goes
     ALL THE WAY UP now, so they no longer touch along an edge — they touch at
     a corner, side by side, and two things standing beside each other want
     two grounds. In dark the bar drops almost onto the pill it carries
     (#16171A against #121110): the pill is the night you are working on, and
     a control sunk into a strip four points off it reads as part of that
     strip rather than a hole cut through it. Light keeps the one value. */
  --deck-bg:#E2DED7;
  /* The night-you-are-on pill. It was drawn on --steel-100, which is the
     ROOM's ground, so the pill and the floor were the same decision and
     neither could move without the other. Same value in both themes as it
     always had — this names it, it does not change it. */
  --deck-pill-bg:#E9E6DF;
  --surface:#FFFFFF;
  --text-primary:#38352F; --text-secondary:#8B877F;
  --lift-1:0 6px 18px rgba(20,24,25,.10);
  --lift-2:0 10px 25px rgba(20,24,25,.12), 0 30px 60px rgba(20,24,25,.22);
  /* The ONE dim every scrim wears, and ink on it. */
  --scrim:rgba(20,24,25,0.55); --on-scrim:#fff;
  /* ONE DIM (POS DESIGN.md § Dim law, Sep '26). It used to be two — .55 for
     "switched off" and .35 for "cannot be pressed" — and the till asked why a
     job needs its own number when the STRIKE already says which one it is.
     It does not. Everything faded reads --dim; a chip a PERSON switched off
     is struck through as well, and that is the whole difference. */
  --ring:1px; --dim:.45;
  /* A cut end fades over a HINT, not a control: it rode 44 in the till until
     Sep '26 and a finger-deep band rubbed out the very key it pointed at. */
  --rail-fade:12px;
  --t-state:.12s; --t-move:.28s;
  --z-panel:45; --z-popup:80; --z-menu:120; --z-toast:200; --z-lock:400;
  --r-btn:8px; --r-control:10px; --r-surface:16px; --r-pill:999px;
  --h-control:44px; --h-primary:64px; --tap:44px; --sq-ctl:44px;
  --deck-edge:16px; --deck-gap:8px; --deck-pad:8px; --deck-h:60px;
  --hub-edge:12px; --list-gap:8px;
  /* The rail, and the book beside the room. Tokens because the booking
     sheet lands on the seam between them and must not hold its own copy. */
  --rail-w:88px; --deskcol-w:340px;
  --fs-chip:10.5px; --fs-md:13.5px; --fs-lg:15px; --fs-xl:19px; --fs-num:24px;
  --num-key-w:84px; --num-key-h:74px; --num-key-r:16px; --num-key-fs:var(--fs-num); --num-gap:12px;
  /* Booking status colours: the floor's own grammar. */
  --st-booked:#8B877F; --st-confirmed:#2F74C9; --st-arrived:#C08A00; --st-seated:#4FA51D; --st-done:#B3ADA0; --st-cancelled:#A8483A; --st-noshow:#6D4FC4;
  --st-due:#C08A00; --st-over:#6D4FC4; --src-online:#0E9E8A; --src-walkin:#C08A00; --src-pos:#918E88;
  /* The two states the floor gained. LATE is the app's red, which is spent
     nowhere else on the drawing, so it can only mean "go and look". A
     WALK-IN is teal — the online source's colour, because both mean "this
     did not come from the desk". */
  --st-late:#A8483A; --st-walkin:#0E9E8A;
  /* THE END OF THE SITTING, which the floor could not say at all. CHECK is a
     magenta nothing else on the drawing wears, so a bill on a table reads
     from across the room; PAID is a cool slate that steps DOWN towards the
     bare paper a free table is, because that is where the table is going.
     Neither is an alarm — the room is telling you which one turns next. */
  --st-check:#B0407A; --st-paid:#6E7F93;
  /* THE FLOOR IS THE TILL'S FLOOR. A table with no finish and no colour of its
     own; the till lifts it off the near-black ground in dark mode rather than
     leaving a dark-on-dark ghost. */
  --table-plain:var(--surface);
  /* A picked table's band. The same hairline + --ring as everything else,
     drawn as ONE band because it covers the table's own edge. */
  --tbl-sel-ring:calc(var(--ring) + 1px);
  /* POP + CREAM, the owner's pick on the till: the wash runs strong and EVERY
     table's number rides a cream chip — empty or seated alike — so no status
     colour and no hand-painted table can make a number unreadable, and
     nothing about the number changes when a table fills or clears. It is the
     one thing on the floor that is the SAME in both themes, because it is
     paper laid on the table, not part of the page. */
  --tbl-num-bg:#F5F1E8; --tbl-num-ink:#33352F;
  /* How hard a booking tints the top it sits on. The till's own default. */
  --tbl-wash:.78;
}
/* §§ DARK IS A LADDER WITH RUNGS YOU CAN SEE.
   The dark theme had the same four rungs the light one does, but crowded into
   eight points of value: the rail at #332F2B against the book at #2B2824 is a
   step of THREE, and the top bar was the book's own colour with a hairline
   between them that was six points off both. Four regions, one mud. Every law
   about three grounds and one hairline was in the stylesheet and none of it
   was on the screen.
   So the rungs are pulled apart — and, more than that, the CHROME is made of
   a different material rather than a lighter shade of the same one. Value
   alone could not fix this: four browns six points apart is still four
   browns, and "too much blending of shades" is exactly what a host sees. The
   frame is COOL and the work is WARM, so the eye separates them by hue
   before it ever measures brightness — which is the only thing that works
   once the rail runs floor to ceiling and is the biggest single area of
   chrome on the screen. A rail bright enough to read as a step UP from the
   paper is a bright column down the left of everything; at that size it has
   weight without brightness, so it takes the hue and leaves the value.
     --steel-100     #121110  the floor, and the page behind everything
     --deck-pill-bg  #121110  the night you are on, sunk into the bar
     --deck-bg       #16171A  the bar — four points off the pill it carries
     --chrome        #1F2126  the RAIL, floor to ceiling down the left — COOL
     --surface       #211E1A  the paper: the book, the rows, the popups — WARM
     --steel-200     #33302B  every hairline ON the paper
     --steel-300     #4A443C  the seams between grounds, so a line is a line
   The rail and the paper are two points apart in brightness and opposite in
   hue. That is deliberate: the seam between them is --steel-300, and a
   column does not need to be lighter than its neighbour to be a column.
   Light keeps its own arrangement: there the paper is white and the bar and
   rail are the warm grey the rail always wore, which is contrast enough. */
body[data-theme="dark"]{
  --steel-100:#121110; --steel-200:#33302B; --steel-300:#4A443C; --steel-500:#6B645A;
  --surface:#211E1A;
  --chrome:#1F2126; --deck-bg:#16171A; --deck-pill-bg:#121110;
  --charcoal:#211E1A; --charcoal-soft:#D9D5CE;
  --text-primary:#EAE8E4; --text-secondary:#D9D5CE;
  --lift-1:0 6px 18px rgba(0,0,0,.40);
  --lift-2:0 10px 25px rgba(0,0,0,.45), 0 30px 60px rgba(0,0,0,.55);
  --orange:#3692E7; --gold:#E8C24D; --green:#7BC72F; --red:#CF6152; --teal:#19C3AB; --violet:#8B6FE8;
  /* A key on the chrome has to be LIGHTER than the chrome, or it is a hole.
     These sat below the old bar and now sit above the new one. */
  --deck-chip-bg:#43474F; --deck-chip-line:#545963; --deck-chip-ink:#CFC9BE;
  --deck-chip-on-bg:#EDE6D6; --deck-chip-on-ink:#26231F;
  --orange-dim:color-mix(in srgb, var(--orange) 27%, var(--surface));
  --green-dim:color-mix(in srgb, var(--green) 20%, var(--surface));
  --st-booked:#A8A399; --st-confirmed:#3692E7; --st-arrived:#E8C24D; --st-seated:#7BC72F; --st-done:#6B645A; --st-cancelled:#CF6152; --st-noshow:#8B6FE8;
  --st-due:#E8C24D; --st-over:#8B6FE8; --src-online:#19C3AB; --src-walkin:#E8C24D; --src-pos:#D9D5CE;
  --st-late:#CF6152; --st-walkin:#19C3AB;
  --st-check:#D96AA3; --st-paid:#9AB0C4;
  --table-plain:#35322D;
}
@media (max-height:560px){ :root{ --num-key-w:64px; --num-key-h:52px; --num-key-r:10px; --num-key-fs:var(--fs-xl); --num-gap:8px; } }
@media (max-width:768px){ :root{ --deck-edge:12px; --hub-edge:8px; } }

/* §§ Base */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--steel-100);color:var(--text-primary);font-family:var(--font-body);font-size:var(--fs-md);font-variant-numeric:tabular-nums;touch-action:pan-x pan-y;overscroll-behavior:none;}
html{-webkit-touch-callout:none;user-select:none;}
input,textarea{user-select:text;-webkit-user-select:text;}
button{font-family:inherit;font-size:inherit;color:inherit;padding:0;cursor:pointer;}
button:active{filter:brightness(.92);}
input:not([type="checkbox"]):not([type="radio"]),textarea,select{font-family:inherit;font-size:var(--fs-md);color:var(--text-primary);background:var(--surface);border:1px solid var(--steel-300);border-radius:var(--r-control);padding:8px 12px;min-height:var(--h-control);width:100%;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:inset 0 0 0 var(--ring) var(--orange);}
select{appearance:none;-webkit-appearance:none;font-weight:700;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
textarea{min-height:64px;resize:vertical;}
*{scrollbar-width:none;} *::-webkit-scrollbar{display:none;}
h1,h2,h3{margin:0;}
.mono{font-family:var(--font-mono);}
.muted{color:var(--charcoal-soft);}
.hidden{display:none!important;}

/* §§ Shell — deck on top, pane below, the phone stacks the same way */
#app{height:100%;display:flex;flex-direction:column;}
/* THE RAIL GOES ALL THE WAY UP. The bar used to run the full width with the
   rail hung underneath it, so the rail began 60 pixels down and the top-left
   corner of the app belonged to the bar — a strip of chrome above the column
   that carries the whole app. The rail is the FIRST thing now and it owns the
   left edge from the window's top to its bottom; the bar is a strip inside
   what is left, so it says which night you are on over the work it applies
   to, and nothing else. */
.shell{height:100%;display:flex;min-height:0;}
/* Deck across the top, then the rail and the pane side by side. The rail is
   a SIBLING of the scroller, not a passenger in it, so the sections stay put
   while the day scrolls under them — which is the whole reason the POS's
   order panel puts its categories in a column rather than a band. */
/* Everything that is not the rail: the bar, then the pane under it. */
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;}
.pane{flex:1;min-height:0;overflow-y:auto;padding:var(--hub-edge);}

/* §§ Rail — the sections of the panel you are in (the POS's category rail)
   Its numbers are the POS's: a 104 column, a uniform square tile, surface
   body, ONE hairline down its edge. Chosen is a pale accent block with accent
   ink; unchosen has no body at all. A solid accent fill is the deck's
   language and never appears here. */
/* 88, not 104. A rail tile is a square, so its WIDTH is what sets how many
   fit down a laptop: at 104 the nine tiles of Service came to 936 and Settings
   fell off the end of an 880 screen. 88 puts the whole app on the rail with no
   scroll at all, and is still twice the finger law. */
/* THE THREE COLUMNS ARE THREE GROUNDS. The rail, the book and the room all
   sat on --surface with a --steel-200 hairline between them, which is what
   the till does — but the till's rail stands beside ONE panel, and this one
   stands beside TWO. Three columns of the same paper separated by a line you
   have to look for is one slab with scratches on it. Three grounds now, one
   step apart down the ladder: the rail on --chrome (the bar's ground too —
   they are one frame), the book on the paper (--surface), the room on the
   till's own --steel-100. And the ROOM'S GROUND
   IS THE WHOLE COLUMN, not a rounded box floating in it. The seams step up to
   --steel-300 so the line is a line. */
.rail{width:var(--rail-w);flex-shrink:0;background:var(--chrome);border-right:1px solid var(--steel-300);
  overflow:hidden;padding:0;display:flex;flex-direction:column;}
/* NO AIR AT THE TOP. The rail carried 8 of its own padding above the first
   tile, so the tile you are IN stopped 8 pixels short of the top bar and the
   rail’s own colour showed through as a strip above it — a gap between the
   two things that touch. The column starts where the pane starts and ends
   where the window does; a tile’s air is its own padding, which is the
   same reason there is no gap BETWEEN them. */
.rail-btn{width:100%;aspect-ratio:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:8px 4px;color:var(--charcoal-soft);font-size:var(--fs-chip);font-weight:700;
  text-align:center;letter-spacing:.3px;}
.rail-btn.active{background:var(--orange-dim);color:var(--orange);}
.rail-ico{display:flex;}
.rail-ico svg{width:24px;height:24px;}
.rail-label{line-height:1.15;}
/* How many the tile holds, over the WHOLE book. Quiet: it is a fact about
   the list, not a call to open it — the deck's badges are the ones that
   shout. It inherits the tile's ink, so it goes accent with the rest when
   the tile is chosen rather than being a second colour. */
.rail-n{font-family:var(--font-mono);font-size:var(--fs-chip);font-weight:700;opacity:.65;}

/* A rail lying on its side is a ROW, so its band runs along it. */
.rail{--rail-axis:90deg;}
@media (min-width:761px){ .rail{--rail-axis:180deg;} }
.rail::-webkit-scrollbar{display:none;}
/* THE 768 BLOCK IS GONE (Sep '26). It put the rail across the TOP as a row
   of pills and predates the thumb bar at the foot, which keys on 760 — so
   two things were wrong at once and neither was visible from a desk. Below
   760 its `flex-direction:row` on a tile survived the thumb bar's own rules
   (they never set a direction), and every key down there wore its glyph
   BESIDE its word instead of above it. And between 761 and 768 — eight
   pixels wide, but that is the phone-sideways shape, which starts at 761 —
   the rail jumped to the top of the screen, which is the one place that
   shape has no room for it. */

/* §§ The deck (Deck law: 8 pad, 8 gap, edge 16/12, 60 tall, 44 tappable) */
/* THE BAR IS CHROME, NOT PAPER. It used to be drawn on --surface, which is
   also the book's ground — so in dark the two met at a hairline six points
   off both of them and the night you are working on floated in the middle of
   the list. It carries --deck-bg now: the paper in light, where that has
   always read, and the rail's own tone in dark, where the bar and the rail
   together are one frame around the work. */
.topbar{display:flex;align-items:center;gap:var(--deck-gap);padding:var(--deck-pad) var(--deck-edge);min-height:var(--deck-h);background:var(--deck-bg);border-bottom:1px solid var(--steel-300);flex-shrink:0;}
.tabs{display:flex;gap:var(--deck-gap);overflow-x:auto;min-width:0;}
.tab-btn{background:var(--deck-chip-bg);border:1px solid var(--deck-chip-line);color:var(--deck-chip-ink);font-weight:600;font-size:var(--fs-md);padding:8px 12px;border-radius:var(--r-control);min-height:var(--tap);min-width:84px;text-align:center;white-space:nowrap;}
.tab-btn.active{background:var(--deck-chip-on-bg);border-color:var(--deck-chip-on-bg);color:var(--deck-chip-on-ink);}
.deck-spacer{flex:1;}
.deck-sq{width:var(--tap);height:var(--tap);min-width:var(--tap);border-radius:var(--r-control);border:1px solid var(--deck-chip-line);background:var(--deck-chip-bg);color:var(--deck-chip-ink);display:inline-flex;align-items:center;justify-content:center;}
/* Ghost: the target is still 44, but nothing is drawn until a finger is on it.
   A day arrow is not a key you weigh up, it is the way to the night before. */
.deck-sq.ghost{border-color:transparent;background:none;color:var(--text-secondary);}
.deck-sq.ghost:hover{background:var(--steel-200);color:var(--text-primary);}
.deck-sq svg,.deck-sq .sys-i{width:20px;height:20px;}
.deck-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;}
.deck-dot.off{background:var(--red);}
.deck-dot.warn{background:var(--gold);}
/* The deck holds six tabs and four squares, and an 84px minimum on each tab
   stops fitting long before a phone does. A tablet in PORTRAIT is where it
   first bites: at 820 the row overflowed and "Settings" was the half off the
   end — on a manager's tablet, the one tab they need is the one they cannot
   see. So the squeeze comes in stages. */
@media (max-width:1100px){ .tab-btn{min-width:0;flex:none;padding:8px 10px;} }
/* And when it still does not fit — a long count on Waitlist, a narrow phone —
   nothing is ever sliced: the row fades at the cut end so a half-shown tab
   reads as "more this way" rather than a broken word. The POS's nav law. */
.tabs{scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
/* THREE RULES, ONE DEPTH, AND THEY ONLY DRAW WHERE THERE IS MORE THAT WAY.
   The list of scrollers lives in app.js (RAIL_ENDS) and nowhere else; an
   element wears the band the moment markRailEnds() marks data-more on it.
   --rail-axis is the way the scroller runs, 90deg along a row and 180deg
   down a column; --fade-top and --fade-foot move the band in past a bar
   pinned over that end, so the bar's keys never fade. */
[data-more="end"]{-webkit-mask-image:linear-gradient(var(--rail-axis,180deg),#000 calc(100% - var(--fade-foot,0px) - var(--rail-fade)),transparent calc(100% - var(--fade-foot,0px)),#000 calc(100% - var(--fade-foot,0px)));mask-image:linear-gradient(var(--rail-axis,180deg),#000 calc(100% - var(--fade-foot,0px) - var(--rail-fade)),transparent calc(100% - var(--fade-foot,0px)),#000 calc(100% - var(--fade-foot,0px)));}
[data-more="start"]{-webkit-mask-image:linear-gradient(var(--rail-axis,180deg),#000 var(--fade-top,0px),transparent var(--fade-top,0px),#000 calc(var(--fade-top,0px) + var(--rail-fade)));mask-image:linear-gradient(var(--rail-axis,180deg),#000 var(--fade-top,0px),transparent var(--fade-top,0px),#000 calc(var(--fade-top,0px) + var(--rail-fade)));}
[data-more="start end"]{-webkit-mask-image:linear-gradient(var(--rail-axis,180deg),#000 var(--fade-top,0px),transparent var(--fade-top,0px),#000 calc(var(--fade-top,0px) + var(--rail-fade)),#000 calc(100% - var(--fade-foot,0px) - var(--rail-fade)),transparent calc(100% - var(--fade-foot,0px)),#000 calc(100% - var(--fade-foot,0px)));mask-image:linear-gradient(var(--rail-axis,180deg),#000 var(--fade-top,0px),transparent var(--fade-top,0px),#000 calc(var(--fade-top,0px) + var(--rail-fade)),#000 calc(100% - var(--fade-foot,0px) - var(--rail-fade)),transparent calc(100% - var(--fade-foot,0px)),#000 calc(100% - var(--fade-foot,0px)));}
/* A ROW WEARS A ROW'S AXIS. A row given a column's fade shades its top and
   bottom and slices its ends anyway. */
.tabs,.secband,.desk-main > .fl-wrap{--rail-axis:90deg;}

/* §§ Login — the POS's number pad, the same five tokens */
/* The keypad the front door used to wear. There is no front door now — the
   desk opens — and these are the manager prompt's. */
.pin-dots{display:flex;gap:16px;justify-content:center;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--steel-300);}
.pin-dot.filled{background:var(--text-primary);border-color:var(--text-primary);}
.pin-dots.shake{animation:lgShake .3s ease;}
@keyframes lgShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,var(--num-key-w));gap:var(--num-gap);}
.pin-pad button{height:var(--num-key-h);border-radius:var(--num-key-r);border:1px solid var(--steel-300);background:var(--surface);color:var(--text-primary);font-size:var(--num-key-fs);font-weight:600;}
.pin-pad button svg{width:26px;height:26px;display:block;margin:0 auto;}
.pin-pad button[disabled]{opacity:var(--dim);}
.pin-pad button.util{font-size:var(--fs-xl);color:var(--charcoal-soft);}
.pin-pad button[data-act="pin-enter"]{grid-column:3;background:var(--green);border-color:var(--green);color:#fff;}
.login-error{color:var(--red);font-weight:700;margin-top:12px;min-height:20px;text-align:center;}

/* §§ Bands and chips (Chip law: every selector is a chip; a row of chips is a band) */
.band{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-control);flex-wrap:wrap;margin-bottom:var(--hub-edge);}
.band .spacer{flex:1;}
.chip{min-height:38px;padding:7px 13px;border-radius:var(--r-control);border:1px solid var(--steel-300);background:var(--steel-100);color:var(--charcoal-soft);font-weight:600;font-size:var(--fs-md);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.chip.active{background:var(--orange);border-color:var(--orange);color:#fff;}
/* The finger law. A square chip is nothing but a target — there is no label
   to widen it — so it is the full 44 and not the band chip's 38. It used to
   be 38 with three scoped overrides pushing it back to 44 in the places
   somebody noticed; a law with three exceptions is not a law. */
.chip.sq{width:var(--sq-ctl);min-height:var(--sq-ctl);padding:0;}
.chip.sq svg{width:18px;height:18px;}
.chip[disabled]{opacity:var(--dim);cursor:default;}
.chip.go{background:var(--green);border-color:var(--green);color:#fff;}
.chip.warn{border-color:var(--gold);color:var(--gold);}
.band .title{font-weight:800;font-size:var(--fs-lg);padding:0 6px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips .chip{min-height:var(--tap);}
.chip .sub{font-family:var(--font-mono);font-size:var(--fs-chip);opacity:.8;}
.chip.taken{opacity:var(--dim);text-decoration:line-through;}
/* A chip for something that is there but not on offer: a slot that has gone,
   a date the venue has closed. Global, so the desk's slots and the guests'
   date chips strike through the same way. */
.chip.off{opacity:var(--dim);text-decoration:line-through;}
.chip.best{border-color:var(--green);color:var(--green);}
.chip.best.active{background:var(--green);border-color:var(--green);color:#fff;}

/* §§ Notice — a day-level statement (closed, special hours). The page's own
   voice, above the numbers; .modal .warnbox is the popup's. The ink stays
   --text-primary in both variants: gold on a gold wash fails contrast. */
.notice{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:var(--hub-edge);border:1px solid var(--steel-300);border-radius:var(--r-control);background:var(--surface);font-weight:600;color:var(--text-primary);flex-wrap:wrap;}
.notice b{font-weight:800;}
.notice.closed{border-color:var(--violet);background:color-mix(in srgb, var(--violet) 10%, var(--surface));}
.notice.special{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 12%, var(--surface));}

/* §§ Stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--list-gap);margin-bottom:var(--hub-edge);}
.stat{background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-control);padding:12px;display:flex;flex-direction:column;gap:2px;}
.stat b{font-family:var(--font-mono);font-size:var(--fs-num);font-weight:700;line-height:1;}
.stat span{font-size:var(--fs-chip);font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);}
/* A money tile. --fs-num is 24px mono and a .grid3 column at 360px is about
   120px of text room, so a four-figure total would clip; --fs-xl keeps any
   realistic amount inside its tile. Size only — no colour, so both themes and
   the print block are unaffected. */
.stat.money b{font-size:var(--fs-xl);letter-spacing:-.2px;}

/* §§ Rows (Row law: corner 10, one hairline, 8 apart, 54 tall, picked = accent ring + wash) */
.rows{display:flex;flex-direction:column;gap:var(--list-gap);}
.row{display:flex;align-items:center;gap:8px;min-height:54px;padding:0 12px 0 0;background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-control);cursor:pointer;overflow:hidden;}
.row.selected{border-color:var(--orange);box-shadow:inset 0 0 0 var(--ring) var(--orange);background:var(--pick-wash);}
.row .cell{width:var(--tap);min-width:var(--tap);align-self:stretch;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;background:var(--steel-500);color:var(--charcoal);border-right:1px solid var(--steel-200);flex-direction:column;line-height:1.1;}
.row .cell small{font-size:var(--fs-chip);font-weight:500;}
.row .body{flex:1;min-width:0;padding:8px 0;display:flex;flex-direction:column;gap:2px;}
.row .t1{font-weight:700;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;}
.row .t2{font-size:var(--fs-md);color:var(--charcoal-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .actions{display:flex;gap:6px;flex:none;}
.row .actions .chip{min-height:38px;padding:7px 10px;}
/* A row whose only action is one icon key gives it the whole finger (44). */
.row.dim{opacity:var(--dim);}
.section-h{font-weight:800;font-size:var(--fs-lg);margin:16px 0 8px;display:flex;align-items:center;gap:8px;}
.section-h:first-child{margin-top:0;}
.section-h .count{font-family:var(--font-mono);font-size:var(--fs-chip);color:var(--charcoal-soft);font-weight:700;}
.empty{text-align:center;color:var(--charcoal-soft);padding:48px 0;font-weight:600;}

/* §§ Status chips */
.status-chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-chip);font-weight:700;padding:4px 8px;border-radius:var(--r-pill);text-transform:uppercase;letter-spacing:.3px;color:#fff;white-space:nowrap;vertical-align:middle;}
.status-chip svg{width:13px;height:13px;flex:0 0 13px;}
.status-chip.booked{background:var(--st-booked);} .status-chip.confirmed{background:var(--st-confirmed);} .status-chip.arrived{background:var(--st-arrived);}
.status-chip.seated{background:var(--st-seated);} .status-chip.done{background:var(--st-done);} .status-chip.cancelled{background:var(--st-cancelled);} .status-chip.no-show{background:var(--st-noshow);}
/* A PART WEARS ITS WHOLE S COLOUR. Half a party through the door is not a new
   thing on the floor, it is less of the same thing, and the chip already
   carries the word. The DOT is where the halving is drawn, below. */
.status-chip.part-arrived{background:var(--st-arrived);} .status-chip.part-seated{background:var(--st-seated);}
.status-chip.check{background:var(--st-check);} .status-chip.paid{background:var(--st-paid);}
.status-chip.online{background:var(--src-online);} .status-chip.walk-in{background:var(--src-walkin);} .status-chip.pos{background:var(--src-pos);}
.tag{font-size:var(--fs-chip);font-weight:700;padding:3px 7px;border-radius:var(--r-pill);border:1px solid var(--steel-300);color:var(--charcoal-soft);white-space:nowrap;}
.tag.hot{border-color:var(--red);color:var(--red);}
/* A tag that carries a glyph — the cake on a birthday — lays out as a row. */
.tag{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}
.tag svg{width:13px;height:13px;flex:0 0 13px;}

/* §§ Notify list — a freed slot and the people it could seat */
.stat[data-act]{cursor:pointer;}
.band.opening{border-color:var(--teal);}
.band.opening .title{color:var(--teal);}
/* The mirror of .tag.hot: the one to ring first. */
.tag.good{border-color:var(--green);color:var(--green);}
/* These are pressed mid-service with a phone in the other hand, so they get
   the whole finger (44) rather than the 38 a secondary row key takes. Scoped,
   like .exc-actions, so no other row changes. */
.band.opening .chip{min-height:var(--tap);}
.row .actions.nl-actions .chip{min-height:var(--tap);}

/* §§ The timeline — tables down the side, the service across the top */
.tl{background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-control);overflow:auto;position:relative;max-height:calc(100vh - 260px);}
.tl-grid{display:grid;min-width:max-content;position:relative;}
.tl-head{position:sticky;top:0;z-index:3;display:contents;}
.tl-corner{position:sticky;left:0;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--steel-200);border-right:1px solid var(--steel-200);}
.tl-times{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--steel-200);display:flex;height:32px;}
.tl-times span{flex:none;font-family:var(--font-mono);font-size:var(--fs-chip);font-weight:700;color:var(--charcoal-soft);display:flex;align-items:center;padding-left:6px;border-left:1px solid var(--steel-200);}
.tl-label{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--steel-200);border-bottom:1px solid var(--steel-200);display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:700;min-height:44px;white-space:nowrap;}
.tl-label small{font-family:var(--font-mono);font-size:var(--fs-chip);color:var(--charcoal-soft);font-weight:700;}
.tl-label.floor{background:var(--steel-100);color:var(--charcoal-soft);font-size:var(--fs-chip);text-transform:uppercase;letter-spacing:.5px;min-height:28px;}
.tl-lane{position:relative;border-bottom:1px solid var(--steel-200);min-height:44px;background-image:linear-gradient(to right,var(--steel-200) 1px,transparent 1px);background-size:var(--tl-hour) 100%;}
.tl-lane.floor{min-height:28px;background:var(--steel-100);}
.tl-lane.unassigned{background-color:var(--pick-wash);}
.tl-block{position:absolute;top:5px;height:34px;border-radius:var(--r-btn);padding:0 8px;display:flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;cursor:pointer;border:1px solid transparent;}
.tl-block small{font-family:var(--font-mono);font-size:var(--fs-chip);font-weight:700;opacity:.9;}
.tl-block.booked{background:var(--st-booked);} .tl-block.confirmed{background:var(--st-confirmed);} .tl-block.arrived{background:var(--st-arrived);}
.tl-block.seated{background:var(--st-seated);} .tl-block.done{background:var(--st-done);}
.tl-block.part-arrived{background:var(--st-arrived);} .tl-block.part-seated{background:var(--st-seated);}
.tl-block.check{background:var(--st-check);} .tl-block.paid{background:var(--st-paid);}
.tl-block.cancelled{background:var(--st-cancelled);} .tl-block.no-show{background:var(--st-noshow);}
.tl-block.conflict{border-color:var(--red);box-shadow:inset 0 0 0 var(--ring) var(--red);}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1;pointer-events:none;}
.tl-slot{position:absolute;top:0;bottom:0;cursor:pointer;}
.tl-slot:active{background:var(--orange-dim);}

/* §§ Timeline drag — the block you are carrying */
/* Tokens only, both themes. The drop marker wears the Row law's picked
   grammar (accent ring + wash); gold is the popup's warning, red its warnbox. */
.tl-block.movable{cursor:grab;}
.tl-block.extra{opacity:.7;}                     /* a joined booking's other lanes */
.tl-drag-src{opacity:var(--dim);cursor:grabbing;}
.tl-drag-ghost{position:fixed!important;z-index:var(--z-menu);pointer-events:none;margin:0;opacity:.95;box-shadow:var(--lift-2);will-change:translate;}
.tl-drop{position:absolute;top:5px;height:34px;border-radius:var(--r-btn);border:1px solid var(--orange);box-shadow:inset 0 0 0 var(--ring) var(--orange);background:var(--pick-wash);pointer-events:none;}
.tl-drop.warn{border-color:var(--gold);box-shadow:inset 0 0 0 var(--ring) var(--gold);background:color-mix(in srgb, var(--gold) 12%, var(--surface));}
.tl-drop.bad{border-color:var(--red);box-shadow:inset 0 0 0 var(--ring) var(--red);background:color-mix(in srgb, var(--red) 10%, var(--surface));}
/* background-COLOR only: the lane's hour grid is a background-image. */
.tl-lane.over{background-color:var(--orange-dim);}
/* The hint IS the toast, hand-placed clear of a real one. Three classes so it
   still beats body[data-theme="dark"] .toast in dark mode. */
.toast.tl-hint{bottom:80px;pointer-events:none;}
.toast.tl-hint.warn{background:var(--gold);color:var(--charcoal);}
.toast.tl-hint.bad{background:var(--red-btn);color:#fff;}

/* §§ Diary — the month, one tile a day */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal .dow{text-align:center;font-size:var(--fs-chip);font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--charcoal-soft);padding:4px 0;}
.cal .day{aspect-ratio:1;background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-control);padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;min-height:56px;}
.cal .day.out{opacity:var(--dim);}
/* A day tile keeps its ONE hairline in --steel-200 and says the rest with a
   ring, so a day that is several things at once is never two colours of edge
   at the same time. Declared in order of what the desk has to act on, least
   first, so the last one that applies wins: special hours, then today, then
   bookings sitting on a day that takes none. */
.cal .day.special{box-shadow:inset 0 0 0 var(--ring) var(--gold);}
.cal .day.today{box-shadow:inset 0 0 0 var(--ring) var(--orange);}
.cal .day.closed{background:var(--steel-100);}
/* Bookings on a day that takes none: the desk still has to call those guests. */
.cal .day.clash{box-shadow:inset 0 0 0 var(--ring) var(--red);}
.cal .day.clash .c{color:var(--red);}
.cal .day .n{font-weight:700;}
.cal .day .c{font-family:var(--font-mono);font-size:var(--fs-chip);font-weight:700;color:var(--charcoal-soft);}
.cal .day .exc-note{font-size:var(--fs-chip);font-weight:700;color:var(--charcoal-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal .day .bar{height:4px;border-radius:var(--r-pill);background:var(--steel-200);overflow:hidden;}
.cal .day .bar i{display:block;height:100%;background:var(--orange);}
/* On a phone a tile is ~50px wide: the note would ellipsis to two letters, so
   the shading and the ring carry it and the day itself tells the whole story. */
@media (max-width:768px){ .cal .day{min-height:44px;padding:4px 6px;} .cal .day .c,.cal .day .exc-note{display:none;} }

/* §§ Cards (admin pages) */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--hub-edge);align-items:start;}
.settings-card{background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-surface);padding:16px;display:flex;flex-direction:column;gap:8px;}
.settings-card.wide{grid-column:1 / -1;}
.th{font-weight:800;font-size:var(--fs-lg);letter-spacing:.2px;}
.ts{font-size:var(--fs-md);color:var(--charcoal-soft);}
.field-label,.modal label{font-size:var(--fs-chip);font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;display:block;margin:12px 0 6px;}
.field-label:first-child,.modal label:first-child{margin-top:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media (max-width:480px){ .grid3{grid-template-columns:1fr 1fr;} }
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
label.toggle-row{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--fs-md);font-weight:400;color:var(--text-primary);text-transform:none;letter-spacing:0;margin:0;min-height:var(--tap);}
.switch{width:52px;height:30px;border-radius:var(--r-pill);border:1px solid var(--steel-300);background:var(--steel-200);position:relative;flex:none;transition:background var(--t-state);}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:var(--lift-1);transition:left var(--t-state);}
.switch.on{background:var(--green);border-color:var(--green);}
.switch.on .knob{left:25px;}
/* white-space: a button's label is one line. Without it the Notify form's
   "Add to list" broke onto three when the row got tight, which reads as a
   layout that has come apart rather than a button. */
.btn{min-height:var(--h-control);padding:8px 16px;border-radius:var(--r-control);border:1px solid var(--steel-300);background:var(--steel-100);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.btn.go{background:var(--green);border-color:var(--green);color:#fff;}
.btn.add{background:var(--green);border-color:var(--green);color:#fff;}
.btn.danger{background:var(--red-btn);border-color:var(--red-btn);color:#fff;}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;}
.btn[disabled]{opacity:var(--dim);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--fs-md);}
.kv b{font-weight:700;}
.qr{width:200px;height:200px;border-radius:var(--r-control);background:#fff;padding:8px;}
.svc-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;}
.days{display:flex;gap:4px;}
.days .chip{min-width:38px;padding:7px 0;min-height:38px;}
.audit{font-size:var(--fs-md);display:flex;flex-direction:column;gap:6px;}
.audit div{display:grid;grid-template-columns:120px 100px 1fr;gap:8px;}
.audit .mono{color:var(--charcoal-soft);font-size:var(--fs-chip);}
@media (max-width:640px){ .audit div{grid-template-columns:1fr;gap:0;} .svc-row{grid-template-columns:1fr 1fr;} }

/* §§ Stepper (Stepper law: two square keys and a value that never moves) */
.stepper{display:inline-flex;align-items:center;gap:4px;}
.stepper button{width:var(--tap);height:var(--tap);border-radius:var(--r-control);border:1px solid var(--steel-300);background:var(--surface);font-size:var(--fs-xl);font-weight:600;color:var(--text-primary);display:inline-flex;align-items:center;justify-content:center;}
.stepper b{min-width:var(--tap);text-align:center;font-family:var(--font-mono);font-size:var(--fs-xl);font-weight:700;}
.stepper input{width:64px;text-align:center;font-family:var(--font-mono);font-weight:700;}

/* §§ Popup (Popup law: a FORM is 520 wide, corner 16, padding 24, keys 76x64) */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:var(--z-popup);padding:20px;}
.modal{background:var(--surface);border-radius:var(--r-surface);width:100%;max-width:520px;padding:24px;box-shadow:var(--lift-2);max-height:calc(100vh - 40px);overflow-y:auto;}
.modal.wide{max-width:720px;}
.modal h2{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.2px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;}
.icon-action{width:76px;height:var(--h-primary);border:none;border-radius:var(--r-control);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:var(--fs-xl);line-height:1;flex:0 0 auto;}
.icon-action svg{width:24px;height:24px;}
.icon-action .ia-label{font-size:var(--fs-chip);font-weight:700;letter-spacing:.3px;}
.icon-action.neutral{background:var(--steel-200);color:var(--text-primary);}
.icon-action.send{background:var(--green);}
.icon-action.discard{background:var(--red-btn);}
.icon-action.warn{background:var(--gold);}
.modal-actions .left{margin-right:auto;}
.modal .warnbox{background:color-mix(in srgb, var(--red) 10%, var(--surface));border:1px solid var(--red);border-radius:var(--r-control);padding:8px 12px;font-weight:600;color:var(--red);margin-top:12px;}
.modal .okbox{background:var(--green-dim);border:1px solid var(--green);border-radius:var(--r-control);padding:8px 12px;font-weight:600;margin-top:12px;}
.modal .err{color:var(--red);font-weight:700;margin-bottom:8px;}
@media (max-width:768px){ .modal-bg{padding:10px;} .modal{padding:20px;max-height:calc(100vh - 20px);} }
.status-row{display:flex;flex-wrap:wrap;gap:6px;}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;max-height:190px;overflow-y:auto;padding:2px;}
.slots .chip{padding:7px 4px;font-family:var(--font-mono);}
.hist{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
.hist div{display:flex;gap:8px;align-items:center;font-size:var(--fs-md);}
.hist .mono{color:var(--charcoal-soft);}
/* A booking's own history: the same rows, but a line is a sentence, so on a
   phone it drops under the stamp instead of being squeezed. Tokens only. */
.hist.events div{flex-wrap:wrap;align-items:baseline;}
.hist.events .mono{font-size:var(--fs-chip);}
.hist.events .ts{flex:1 1 auto;}
/* Once a line wraps, one hairline keeps each change a change of its own. */
@media (max-width:768px){
  .hist.events div{gap:4px 8px;padding-bottom:8px;border-bottom:1px solid var(--steel-200);}
  .hist.events div:last-child{border-bottom:0;padding-bottom:0;}
}

/* §§ Find a booking — the deck's search popup */
/* The .slots / .hist precedent: a scrollable list inside a popup gets one
   class and nothing else. Rows, chips, headings and keys are all existing
   classes, so both themes and the finger law come along for free. */
.find-list{display:flex;flex-direction:column;gap:var(--list-gap);max-height:46vh;overflow-y:auto;padding:2px;margin-top:8px;}

/* §§ Toast */
/* The dot says HOW IT WENT: green for something that happened, red for
   something that did not. The till's own, verbatim — it was always green
   there too, which is how "Could not print the sample." came to arrive in
   the success colour. */
.toast .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;}
.toast .dot.bad{background:var(--red-btn);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-weight:600;font-size:var(--fs-md);z-index:var(--z-toast);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--lift-1);}
body[data-theme="dark"] .toast{background:#EDE6D6;color:#26231F;}

/* §§ The guests' booking page — one column, the same tokens */
body.book-page{overflow:auto;height:auto;min-height:100%;touch-action:auto;}
body.book-page #app{display:block;height:auto;}
.book{max-width:520px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:16px;}
.book .venue{font-size:var(--fs-lg);font-weight:800;letter-spacing:4px;text-transform:uppercase;text-align:center;}
.book h1{font-size:var(--fs-xl);font-weight:700;text-align:center;}
.book .card{background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-surface);padding:20px;display:flex;flex-direction:column;gap:8px;}
.book .field-label:first-child{margin-top:0;}
.book .dates{display:flex;gap:6px;overflow-x:auto;padding:2px;}
.book .dates .chip{flex:none;flex-direction:column;gap:0;min-width:64px;min-height:56px;line-height:1.15;}
.book .dates .chip small{font-size:var(--fs-chip);opacity:.85;}
.book .done{ text-align:center;display:flex;flex-direction:column;gap:8px;}
.book .ref{font-family:var(--font-mono);font-size:var(--fs-num);font-weight:700;letter-spacing:2px;}
.book .foot{text-align:center;color:var(--charcoal-soft);font-size:var(--fs-md);}

/* §§ Run sheet — the day on paper */
/* Today's third mode, sized like a sheet of paper rather than a screen. Every
   colour is a token, so the §§ Print block at the foot of this file turns the
   whole thing black on white without touching a single rule here. */
.sheet{max-width:900px;margin:0 auto;background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-surface);padding:24px;display:flex;flex-direction:column;gap:16px;}
.sheet-head{display:flex;flex-direction:column;gap:4px;}
.sheet-venue{font-size:var(--fs-lg);font-weight:800;letter-spacing:5px;text-transform:uppercase;}
.sheet-day{font-size:var(--fs-xl);font-weight:700;}
.sheet .section-h{margin:0 0 8px;}
.sheet .stats{margin-bottom:0;}
/* time · party · who they are · table · covers so far */
.sheet-line{display:grid;grid-template-columns:56px 44px 1fr auto 48px;gap:8px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--steel-200);}
.sl-time,.sl-pax,.sl-table,.sl-run{font-family:var(--font-mono);font-weight:700;}
.sl-table,.sl-run{text-align:right;white-space:nowrap;}
.sl-run{color:var(--text-secondary);}
/* The waitlist and the cancellations have no table column and no covers
   column; an empty cell would still claim a row of its own once the grid
   wraps on a phone. The track stays, so every line still lines up. */
.sl-table:empty,.sl-run:empty{display:none;}
.sl-main{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;}
.sl-name{font-weight:700;}
.sl-meta{flex:1 0 100%;color:var(--charcoal-soft);}
/* currentColor means the box is right in light, in dark and on paper without
   a second rule anywhere. */
.sheet-allergies{border:1px solid currentColor;border-radius:var(--r-control);padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.sheet-allergy{display:grid;grid-template-columns:56px 1fr;gap:8px 12px;align-items:baseline;}
.sheet-allergy .sl-eq{display:block;font-weight:700;margin-top:2px;}
/* SCREEN only. A4 less its margins is about 703px, so a plain width query
   would put the phone layout on every printed run sheet — dropping the
   running covers column that the line above the sheet tells the reader to
   look at, and moving the table under the name on a page with room for it.
   Paper is narrow; it is not a phone. */
@media screen and (max-width:768px){
  .sheet{padding:16px;border-radius:var(--r-control);}
  /* The covers column goes; the table moves under the name, where there is
     room for a floor's own prefix. */
  .sheet-line{grid-template-columns:52px 40px 1fr;}
  .sheet-line .sl-table{grid-column:3;text-align:left;}
  .sheet-line .sl-run{display:none;}
  .sheet-allergies{padding:12px;}
}

/* §§ Set menus — the covers a booking has committed */
/* Teal is already this app's colour for a thing that comes from outside the
   desk (the online source chip, the notify list's openings), and a set menu
   is the POS's. Tokens only, so dark mode and the print block follow. */
.tag.set{border-color:var(--teal);color:var(--teal);}
.stat.set{border-color:var(--teal);}
.stat.set b{color:var(--teal);}
/* The finger law (44) for this card's own remove key. Scoped like the
   .exc-actions rule, so the Tables card beside it is unchanged. */
/* Inside a timeline block the ink is already #fff on a status colour, so the
   menu reads as a wash of that same white rather than a second colour. Not
   mono: a menu name is prose, unlike the time and the party beside it. */
.tl-block .tl-set{font-family:var(--font-body);background:color-mix(in srgb, #fff 24%, transparent);border-radius:var(--r-pill);padding:1px 6px;font-weight:700;opacity:1;max-width:40%;overflow:hidden;text-overflow:ellipsis;}

/* §§ Floor — the room at a moment
   A DIFFERENT GRAMMAR FROM THE TIMELINE, on purpose. The timeline colours a
   block by the BOOKING's status; the floor colours a table by the TABLE's
   state, which is four things and not seven (availability.js says why).
   Green is shared between them because it means the same thing in both —
   somebody is eating. Gold and violet are the two questions only a room can
   ask: who is late, and who is running over. Tokens throughout, so both
   themes and the print block follow. */
/* `.fl-key` went with the last legend on the app (the flow's, Sep '26). The
   DOT stays: it is not a legend there, it is the free-or-taken mark beside a
   table in the booking sheet's own list, where it is the answer and not a
   note about the answer. */
.fl-dot{width:10px;height:10px;border-radius:var(--r-pill);border:1px solid var(--steel-300);background:var(--surface);}
.fl-dot.seated{background:var(--st-seated);border-color:var(--st-seated);}
.fl-dot.over{background:var(--st-over);border-color:var(--st-over);}
.fl-dot.due{background:var(--st-due);border-color:var(--st-due);}

/* The canvas is the POS's own: 900 by 560, so a plan drawn here sits exactly
   where it sits on the till. */
/* The room is a drawing, so it is the one thing on this page allowed to run
   wider than a phone — in its own scroller, never the page's. Below about
   560 the tables are 6% of nothing and no label survives. */
.fl-wrap{overflow-x:auto;}
/* NO frame. The drawing has walls; a border around them is a second frame
   around the same room, and two frames is what a busy screen looks like. */
/* THE DRAWING IS UNIFORM. Everything inside the room is placed as a share of
   900x560, so the geometry shrinks with the pane — but type is in pixels and
   did not, and --fs-chip is the smallest rung there is, so there was nothing
   to step down to. At a 696-wide room the tables were 0.77 of their drawn
   size under pills still at 1.0, and a neighbour's news lay across the next
   table's: "25m late" ate the last digit of "7:25". A clock time with a digit
   missing is worse than no pill at all.
   So the room is its own size container and every length in the drawing is
   written as its share of the room's width — the px it is at the native 900,
   over 9. The whole picture is then one uniform scale of the same drawing at
   any pane size, which makes an overlap impossible by construction: none at
   900, none anywhere. Small type is the pinch's job, and the pinch can do it
   — a transform magnifies letters. Ratio it cannot touch, which is why this
   had to be fixed here and not there. */
/* THE ROOM IS THE TILL'S ROOM, and it FOLLOWS THE THEME. It was a dark slab
   in both, on the argument that a room is drawn the same way on paper
   whichever way up the page is. The till does not do that: its floor is the
   page's own ground — cream in light, near-black in dark — and the tables are
   what carry the colour. Two apps drawing one floor two ways is the drift
   this repo exists to avoid, so the slab is gone. */
.fl-room{position:relative;aspect-ratio:900/560;width:100%;min-width:560px;
  background:var(--floor-bg, var(--steel-100));border:1px solid var(--steel-200);
  border-radius:var(--r-control);overflow:hidden;container-type:inline-size;}
.desk-main .fl-room{border:none;border-radius:0;}
/* No geometry from the POS: a plain wrapped row, which keeps the states, the
   scrubber and the tapping — the useful half — without inventing a room. */
.fl-room.loose{aspect-ratio:auto;min-width:0;display:flex;flex-wrap:wrap;gap:8px;padding:8px;}
/* The loose fallback is a row of boxes, not a drawing: there is no 900 for a
   length to be a share of, so it keeps the tokens and the fixed pixels. */
.fl-room.loose .fl-table{position:static;width:96px;height:64px;gap:2px;padding:2px;}
.fl-room.loose .fl-in{gap:2px;}
.fl-room.loose .fl-no{font-size:var(--fs-md);}
.fl-room.loose .fl-sub{font-size:var(--fs-chip);}
.fl-room.loose .fl-decor{display:none;}
/* Arranging it. The room is the room — the only differences are that a table
   says it can be picked up, and that the drawing is a little shorter, because
   Settings is a column of cards and a full-height plan would push everything
   under it off the screen. */
.fl-wrap.arrange{margin:8px 0 12px;}
.fl-wrap.arrange .fl-room{min-width:420px;}
.fl-table.arr{cursor:grab;touch-action:none;}
.fl-table.arr:hover{border-color:var(--orange);}
.fl-table.arr.lifting{cursor:grabbing;z-index:2;box-shadow:var(--lift-2);opacity:.92;}
.room-edit{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:var(--hub-edge);align-items:start;}
.room-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;}
@media (max-width:900px){ .room-edit{grid-template-columns:1fr;} .room-list{max-height:none;} }

/* The till's own marker: one hairline, the corner the geometry asks for, and
   the TOP the venue laid — the background and ink are written inline by
   skinStyle(), because a finish belongs to the table, not to a class. */
.fl-table{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2222cqw;overflow:hidden;
  border:1px solid var(--steel-200);background:var(--table-plain);color:var(--text-primary);
  font-family:var(--font-mono);font-weight:700;cursor:pointer;padding:.2222cqw;text-align:center;
  isolation:isolate;}
/* WHAT THE TABLE IS DOING, over what it is MADE OF. A translucent tint under
   the number and above the top, so a burgundy cloth is still burgundy cloth
   with somebody sitting at it — a solid fill hid the room. A free table has
   no wash element at all: at rest, a table is just a table. */
.fl-wash{position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:var(--tbl-wash);}
.fl-wash.seated{background:var(--st-seated);}
.fl-wash.over{background:var(--st-over);}
.fl-wash.due{background:var(--st-due);}
.fl-wash.late{background:var(--st-late);}
.fl-wash.arrived{background:var(--st-confirmed);}
.fl-wash.walkin{background:var(--st-walkin);}
.fl-wash.check{background:var(--st-check);}
.fl-wash.paid{background:var(--st-paid);}
/* THE TILL S MARKS, top corner of the table. A fact about the GUEST, not a
   status: the table s colour still says what the table is doing, and these
   say what the waiter already knows about the people on it. Sized as a share
   of the room like everything else in the drawing. */
.fl-marks{position:absolute;top:.3333cqw;right:.3333cqw;z-index:2;display:flex;gap:.2222cqw;pointer-events:none;}
.fl-mk{display:inline-flex;align-items:center;justify-content:center;font-style:normal;
  min-width:1.5cqw;height:1.5cqw;padding:0 .2222cqw;border-radius:var(--r-pill);
  font-size:1.1667cqw;font-weight:800;line-height:1;box-shadow:var(--lift-1);}
.fl-mk.al{background:var(--st-late);color:var(--on-scrim);}
.fl-mk.vip{background:var(--st-due);color:var(--tbl-num-ink);}
/* A table the APP chose, in the BOOK: the same number, drawn light. Nothing
   else changes — it is a real table and it is really held, it just has
   nobody's name on the choice yet. The FLOOR draws it like any other: a room
   is what is in it, and a host looking across it does not care who decided. */
.bl-table.auto{font-weight:400;opacity:var(--dim);}
/* Two tables pushed together are one booking; the ring says so without a
   second colour. */
.fl-table.joined{box-shadow:inset 0 0 0 var(--ring) var(--orange);}
/* The band is drawn ON TOP of the wash. The wash is a child covering the whole
   table, so an inset shadow on the marker itself is painted over by it and
   only the 1px edge survives — a two-toned rim, the till's own lesson. One
   solid band, -1px so it covers the table's own edge too. */
.fl-table.picked::after{content:'';position:absolute;inset:-1px;z-index:4;pointer-events:none;
  border-radius:inherit;box-shadow:inset 0 0 0 var(--tbl-sel-ring) var(--orange);}
/* Pointed at from the book. The ring goes OUTSIDE so it reads over a seated
   table's fill as well as over an empty one, and it is the only thing on the
   plan drawn in the accent — a room with two accents answers nothing. */

/* Outside only, even on a join: the shadow law allows a ring inside or out,
   never both, and picked outranks joined because it is what was just asked. */
.fl-table.picked.joined{box-shadow:none;}
/* Nothing clips: the pill hangs below the table and a turned table's label
   spills past its corners. The LABEL keeps its own clip, inside .fl-in. */
.fl-table{overflow:visible;}
/* EVERYTHING THAT MUST BE READ RIDES THE CREAM CHIP. The till puts only the
   number on one, because a number is all it writes on a table; this floor
   writes the name and the covers too, and they have to survive the same three
   things the number does — a dark finish, a colour the venue painted by hand,
   and a status wash at .78 over both. One chip carries the lot: number over
   name, in the till's own cream, the same in either theme because it is paper
   laid on the table rather than part of the page. */
.fl-in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1111cqw;
  background:var(--tbl-num-bg);color:var(--tbl-num-ink);padding:.2222cqw .6667cqw;
  border-radius:var(--r-control);box-shadow:var(--lift-1);position:relative;z-index:1;}
/* --fs-md 13.5 and --fs-chip 10.5 at the native 900, as a share of it. */
/* The till's cream chip. It is NOT the dark-mode law's business: the chip is
   paper on the table, the same in both themes, which is the only way a number
   stays readable over a finish, a hand-painted colour and a status wash. */
.fl-no{font-size:1.5cqw;line-height:1.1;font-weight:800;}
.fl-sub{font-family:var(--font-body);font-size:1.1667cqw;font-weight:700;opacity:.75;max-width:10cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* Furniture, not a key. A solid white slab reads as something you press; a
   wall and a bar are the room's edges and want the weight of a pencil line.
   A NAMED piece (bar, pass) keeps a faint wash so its label has a ground; an
   unnamed one — a wall — is the line itself. */
.fl-decor{position:absolute;opacity:.55;background:none;border:1px solid var(--steel-500);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-size:1.1667cqw;font-weight:700;color:var(--steel-500);text-transform:uppercase;
  letter-spacing:.6px;pointer-events:none;}
.fl-decor.wall{background:var(--steel-500);border:none;opacity:.5;}

/* §§ Flow — the shape of the night
   Two series on one plot: the bars are covers walking IN, the pale block
   behind them is how many are SITTING at that moment. The second is what a
   kitchen feels and what a pacing cap alone never shows. */
.flow{background:var(--surface);border:1px solid var(--steel-200);border-radius:var(--r-control);padding:12px;margin-top:var(--hub-edge);}
.flow-plot{position:relative;display:flex;align-items:flex-end;gap:2px;height:180px;
  border-bottom:1px solid var(--steel-300);border-left:1px solid var(--steel-200);}
.flow-col{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:4px;}
.flow-col.hour{border-left:1px solid var(--steel-200);}
/* The hours between lunch and dinner are not on this plot at all; the gap has
   to look like a gap or the afternoon reads as full. */
/* One hairline (Border law): the gap is made by the SPACE, not by a fatter
   line — a heavier border is the one thing a border is never allowed to be. */
.flow-col.brk{border-left:1px solid var(--steel-500);margin-left:12px;}
.flow-room{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--orange) 18%, var(--surface));border-radius:2px 2px 0 0;}
.flow-bar{position:relative;width:70%;background:var(--orange);border-radius:2px 2px 0 0;min-height:1px;}
.flow-col.over .flow-bar{background:var(--red);}
.flow-cap{position:absolute;left:0;right:0;border-top:1px dashed var(--red);pointer-events:none;}
.flow-axis{display:flex;gap:2px;margin-top:4px;}
.flow-axis span{flex:1;min-width:4px;font-family:var(--font-mono);font-size:var(--fs-chip);font-weight:700;color:var(--charcoal-soft);white-space:nowrap;}
/* A phone has room for about six of these, not eleven. */
@media (max-width:640px){ .flow-axis span.on:not(.keep){visibility:hidden;} }
.stat.over{border-color:var(--red);}
.stat.over b{color:var(--red);}

/* §§ Motion respects the person */
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;} }
/* §§ Print — paper is white in any theme */
/* THIS MUST STAY THE LAST SECTION IN THIS FILE. body[data-theme="dark"]
   outranks :root on specificity, so the override has to repeat that selector
   AND sit later in the file; anywhere earlier and a desk in dark mode prints
   light-grey text on nothing. There is deliberately NO print-color-adjust:
   browsers dropping backgrounds by default is exactly what we want, and
   forcing them on would lay the dark theme's surfaces onto paper as ink. */
@media print{
  :root,body,body[data-theme="dark"]{
    --surface:#fff; --steel-100:#fff; --steel-500:#fff; --steel-200:#BDBDBD; --steel-300:#8A8A8A;
    --text-primary:#000; --text-secondary:#000; --charcoal:#000; --charcoal-soft:#000;
    --orange:#000; --green:#000; --red:#000; --gold:#000; --teal:#000; --violet:#000;
    --st-booked:#000; --st-confirmed:#000; --st-arrived:#000; --st-seated:#000;
    --st-done:#000; --st-cancelled:#000; --st-noshow:#000;
    --st-check:#000; --st-paid:#000;
    --lift-1:none; --lift-2:none; --dim:1;
  }
  @page{margin:12mm;}
  /* The app shell is fixed-height with an internal scroller; without these
     resets a print is one clipped page instead of a paginated sheet. */
  html,body{height:auto;background:#fff;}
  #app{height:auto;display:block;}
  .shell{height:auto;display:block;}
  .pane{overflow:visible;height:auto;padding:0;}
  .tl{max-height:none;overflow:visible;}
  .topbar,.rail,.band,.toast,.modal-bg{display:none!important;}
  /* The rail is a sibling of the pane, so its row has to stop being a row or
     the sheet prints in a column the width of what is left beside it. */
  .main{display:block;}
  .sheet{border:none;border-radius:0;padding:0;max-width:none;}
  /* Anything that carries its meaning in a COLOURED FILL with knockout-white
     text prints, with every --st-* at #000, as a black lozenge with nothing
     readable in it. The run sheet is what this app is meant to print, but a
     desk can press Cmd-P on the timeline just as easily, and a page of solid
     black bars is not a print — so these are not scoped to .sheet. The red
     allergy tag loses its colour too, and weight carries the meaning there. */
  .status-chip,.tl-block{background:none!important;color:#000!important;border:1px solid #000;}
  .tl-block small,.tl-block .tl-set{opacity:1;background:none;color:#000;}
  .tl-block.extra,.tl-drag-src{opacity:1;}
  .sheet .tag.hot{font-weight:800;}
  /* Page breaks go on LINES ONLY. A service block is routinely longer than a
     page and a browser answers break-inside:avoid on one with a half-empty
     sheet of paper. */
  .sheet-line,.sheet-allergy{break-inside:avoid;page-break-inside:avoid;}
  .sheet .section-h{break-after:avoid;page-break-after:avoid;}
}

/* The name beside a colour in Settings: what it is, and what it is set to. */
.key-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.key-text b{font-size:var(--fs-md);font-weight:700;}
.key-text span{font-size:var(--fs-chip);color:var(--charcoal-soft);line-height:1.5;}

/* §§ The colour code, as the venue can change it.
   The list's circle. Colour is never the only carrier — the dot has the
   status on it for a finger and for a screen reader, and the row's own
   buttons (Confirm, Arrived, Seat) say where the booking is in words. */
/* The hairline round the dot is NOT a ring in the shadow law's sense — it is
   the drawing. The dot wears a colour the venue picked, so its edge has to
   read on any hue in either theme; that is why it is ink at 14% rather than a
   theme colour, exactly the case the border law exempts. The POS's
   check-shadows gate cannot know our class names, so it reports this one. */
.st-dot{box-shadow:0 0 0 1px color-mix(in srgb, var(--text-primary) 14%, transparent);
  display:inline-block;width:12px;height:12px;border-radius:var(--r-pill);flex:0 0 12px;
  margin-right:8px;vertical-align:-1px;background:var(--steel-500);}
.st-dot.booked{background:var(--st-booked);} .st-dot.confirmed{background:var(--st-confirmed);}
.st-dot.arrived{background:var(--st-arrived);} .st-dot.seated{background:var(--st-seated);}
.st-dot.done{background:var(--st-done);} .st-dot.cancelled{background:var(--st-cancelled);}
.st-dot.no-show{background:var(--st-noshow);}
.st-dot.check{background:var(--st-check);} .st-dot.paid{background:var(--st-paid);}
/* HALF THE DOT FOR HALF THE PARTY. The same colour as the whole, with half of
   it not filled in — one glyph, no new hue, and it says the one thing the
   word beside it says. The ring the dot already wears keeps the empty half a
   circle rather than a bite out of nothing. */
.st-dot.part-arrived{background:linear-gradient(90deg,var(--st-arrived) 50%,var(--steel-500) 50%);}
.st-dot.part-seated{background:linear-gradient(90deg,var(--st-seated) 50%,var(--steel-500) 50%);}

/* The swatch is the POS's: one size, one corner, everywhere a colour is
   picked — 44 square, so it answers the finger law on its own. */
.colour-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 0;}
.colour-dot-btn{width:var(--sq-ctl);height:var(--sq-ctl);flex:0 0 var(--sq-ctl);
  border-radius:var(--r-control);border:1px solid var(--steel-300);cursor:pointer;padding:0;}
.colour-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 16px;}
.colour-swatch{aspect-ratio:1;min-height:var(--sq-ctl);border-radius:var(--r-control);
  border:1px solid var(--steel-300);cursor:pointer;padding:0;}
.colour-swatch.picked{box-shadow:0 0 0 var(--ring) var(--orange);border-color:var(--orange);}
.colour-now{display:flex;align-items:center;gap:12px;margin:12px 0;}
.colour-big{width:56px;height:56px;flex:0 0 56px;border-radius:var(--r-control);
  border:1px solid var(--steel-300);}
input[type=color]{min-height:var(--sq-ctl);padding:4px;cursor:pointer;}
@media (max-width:420px){ .colour-grid{grid-template-columns:repeat(4,1fr);} }

/* §§ The List — groups that shut, rows that open out
   The header is a BAND, not a row: no body, one hairline under it, and the two
   numbers a host counts (bookings, then covers in brackets). A shut group
   keeps its numbers, which is the point of shutting it. */
.bl{display:flex;flex-direction:column;}
.bl-head{display:flex;align-items:center;gap:8px;width:100%;min-height:var(--tap);
  padding:0 12px;background:var(--steel-100);border:none;border-bottom:1px solid var(--steel-200);
  text-align:left;cursor:pointer;}
.bl-head.total{background:none;cursor:default;}
.bl-head.empty{opacity:var(--dim);}
.bl-h-name{flex:1;min-width:0;font-size:var(--fs-chip);font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--charcoal-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bl-head.total .bl-h-name{color:var(--text-primary);}
.bl-h-n{font-family:var(--font-mono);font-weight:700;font-size:var(--fs-md);color:var(--text-primary);}
.bl-h-n i{font-style:normal;color:var(--charcoal-soft);}
.bl-chev{display:flex;color:var(--charcoal-soft);transition:transform var(--t-state);}
.bl-chev svg{width:20px;height:20px;}
.bl-head.shut .bl-chev{transform:rotate(-90deg);}
.bl-head.empty .bl-chev{visibility:hidden;}

.bl-rows{display:flex;flex-direction:column;}
.bl-row{display:flex;align-items:center;border-bottom:1px solid var(--steel-200);background:var(--surface);}
.bl-rows > .bl-row:last-child{border-bottom:none;}
.bl-row.selected{background:var(--pick-wash);box-shadow:inset var(--ring) 0 0 0 var(--orange);}
/* The row proper: five things, and the eye lands on them in the order a host
   asks for them — where it is, when, who, how many, which table. */
.bl-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 4px 8px 12px;
  background:none;border:none;text-align:left;cursor:pointer;}
.bl-main .st-dot{width:16px;height:16px;flex:0 0 16px;margin-right:0;}
.bl-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.bl-who small{font-size:var(--fs-chip);font-weight:700;color:var(--charcoal-soft);
  font-family:var(--font-mono);letter-spacing:.3px;}
.bl-who b{font-size:var(--fs-lg);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bl-marks{display:flex;align-items:center;gap:6px;flex:none;color:var(--charcoal-soft);}
.bl-mark{display:flex;}
.bl-mark svg{width:16px;height:16px;}
.bl-mark.hot{color:var(--red);}
.bl-pax{flex:none;min-width:24px;text-align:right;font-family:var(--font-mono);font-weight:700;
  font-size:var(--fs-lg);color:var(--text-primary);}
/* The table sits in a box of its own, the way the till's does — it is the one
   thing on the row a runner is sent to find. */
/* The table is its own key now: it asks the ROOM a question rather than
   opening the booking, so it sits outside the row's button and answers with
   the accent ring and wash the Row law gives anything picked. */
.bl-tables{flex:none;display:flex;align-items:center;gap:2px;padding-right:12px;}
.bl-plus{padding:0 1px;font-style:normal;font-family:var(--font-mono);font-weight:700;
  color:var(--charcoal-soft);font-size:var(--fs-chip);}
.bl-table{flex:none;min-width:38px;min-height:34px;padding:0 10px;display:flex;align-items:center;
  justify-content:center;border-radius:var(--r-btn);background:var(--steel-100);
  border:1px solid transparent;color:var(--text-primary);
  font-family:var(--font-mono);font-weight:700;font-size:var(--fs-md);white-space:nowrap;}
.bl-table:hover{background:var(--steel-200);}
.bl-table.on{background:var(--pick-wash);border-color:var(--orange);color:var(--orange);}
.bl-table.none{font-family:var(--font-body);font-size:var(--fs-chip);text-transform:uppercase;
  letter-spacing:.5px;color:var(--charcoal-soft);background:none;border:1px dashed var(--steel-300);}


@media (max-width:520px){ .bl-who b{font-size:var(--fs-md);} }

/* §§ A booking covers the page
   A popup is for a question with one answer. A booking is not that: it is a
   guest, a time, a table, a set menu, tags, notes, what they spent and every
   change anyone has made to it. So it takes the whole screen — a header that
   stays put while the detail scrolls under it, and the keys pinned to the
   foot where a thumb already is. */
.modal-bg.full{padding:0;align-items:stretch;justify-content:stretch;}
.modal.full{max-width:none;width:100%;max-height:none;height:100%;border-radius:0;padding:0;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.modal-top{flex:none;display:flex;align-items:center;gap:12px;padding:16px var(--deck-edge);
  border-bottom:1px solid var(--steel-300);background:var(--surface);}
.modal-top h2{flex:1;min-width:0;margin:0;}
.modal-top .chip.sq{flex:none;}
.modal-body{flex:1;min-width:0;overflow-y:auto;padding:16px var(--deck-edge);
  width:100%;max-width:820px;margin:0 auto;}
/* The keys sit on their own bar at the foot rather than at the end of a long
   scroll — Save is never somewhere you have to go looking for it. */
.modal.full .modal-actions{flex:none;margin:0;padding:12px var(--deck-edge);
  padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--steel-300);background:var(--surface);}
@media (min-width:900px){
  /* On a desk screen it is still a page, not a window — but it stops short of
     the edges so the day behind it is visibly still there. */
  .modal-bg.full{padding:24px;}
  .modal.full{border-radius:var(--r-surface);max-width:960px;margin:0 auto;height:100%;}
}

/* §§ The booking SHEET — in from the right, over the room
   Named bk-sheet, not sheet: `.sheet` is already the RUN sheet, the page for
   paper, and a modal that borrowed the name quietly inherited its 900px cap
   and sat centred with the room showing either side of it.
   A booking is read against the night it sits in, so the book stays on screen
   and the sheet takes the room instead of the screen. It lands exactly on the
   seam between them — that is what --rail-w and --deskcol-w are tokens for —
   and slides in from the right, the direction it came from.

   The slide itself is run from app.js (playSheet), wound forward by the clock,
   because a re-render destroys the element a CSS animation was riding on.

   The veil over the book is barely there on purpose: the whole point is that
   the night stays READABLE beside the booking. It is still a veil and still
   closes on a tap, because that is what every other popup here does. */
@media (min-width:900px){
  .modal-bg.bk-sheet{padding:0;align-items:stretch;justify-content:flex-end;background:rgba(20,24,25,.10);}
  .modal.bk-sheet{border-radius:var(--r-surface) 0 0 var(--r-surface);margin:0;
    position:fixed;top:calc(var(--deck-h) + var(--hub-edge));right:0;bottom:var(--hub-edge);
    left:calc(var(--rail-w) + var(--hub-edge) + var(--deskcol-w) + 1px);
    width:auto;max-width:none;height:auto;}
  /* Opened from anywhere that is not the two-column desk there is no seam to
     land on, so it takes the pane. */
  .modal.bk-sheet.pane-wide{left:var(--rail-w);}
  .modal.bk-sheet{box-shadow:var(--lift-2);}
}

/* §§ The booking's rows, and the pages behind them
   The POS's Row law: 54 tall, one hairline, 8 apart. The label on the left,
   what it IS on the right, and a chevron saying there is a page behind it. */
.bk-rows{display:flex;flex-direction:column;gap:var(--list-gap);}
.bk-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 12px;
  background:var(--surface);border:1px solid var(--steel-300);border-radius:var(--r-control);
  text-align:left;cursor:pointer;}
.bk-row.warn{border-color:var(--gold);}
.bk-k{flex:0 0 116px;font-size:var(--fs-chip);font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--charcoal-soft);}
.bk-v{flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:var(--fs-md);
  font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bk-v.none{font-weight:400;color:var(--charcoal-soft);}
.bk-chev{display:flex;flex:none;color:var(--steel-500);}
.bk-chev svg{width:20px;height:20px;}

/* A page behind a row is a list of whole options, not a wall of chips — room
   for the name, what it means, and a tick on the one that is chosen. */
.bk-pick{display:flex;flex-direction:column;gap:var(--list-gap);}
.bk-opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:var(--h-primary);
  padding:12px;background:var(--surface);border:1px solid var(--steel-300);
  border-radius:var(--r-control);text-align:left;cursor:pointer;}
.bk-opt.on{border-color:var(--orange);box-shadow:inset 0 0 0 var(--ring) var(--orange);background:var(--pick-wash);}
.bk-opt.off{opacity:var(--dim);}
.bk-opt-mark{flex:0 0 24px;display:flex;align-items:center;justify-content:center;padding-top:4px;}
.bk-opt-mark:empty{flex:0 0 0;}
.bk-opt-mark .st-dot{margin-right:0;width:14px;height:14px;flex:0 0 14px;}
.bk-opt-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.bk-opt-text b{font-size:var(--fs-lg);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bk-opt-text span{font-size:var(--fs-chip);color:var(--charcoal-soft);line-height:1.5;}
.bk-opt-tick{flex:none;display:flex;color:var(--orange);}
.bk-opt-tick svg{width:24px;height:24px;}
.bk-seats{font-family:var(--font-mono);font-weight:500;font-size:var(--fs-chip);color:var(--charcoal-soft);}
.bk-form{display:flex;flex-direction:column;gap:16px;}
@media (max-width:520px){
  .bk-row{flex-wrap:wrap;gap:2px 12px;align-items:flex-start;padding:10px 12px;}
  .bk-k{flex:1 0 100%;}
  .bk-v{flex:1;}
}

/* §§ The desk — the book in one hand, the room in front of you
   Two columns inside the pane. The LIST is always there, because it is the
   thing a host reads; the rail decides what sits beside it. They stack on
   anything narrow, list first, for the same reason. */
/* THE DESK IS THE PANE: the book and the room, and nothing else. It used to
   be a card floating on the page with 12 of ground all round it and a 16
   corner — a frame around the only thing on the screen, and a frame around
   everything is a frame around nothing. The pane already HAS edges: the top
   bar's hairline above and the rail's down the left. A second hairline 12
   pixels inside those is the Border law's "one hairline" broken twice over,
   and it cost the room 24 of width and 24 of height for the privilege. */
.pane:has(> .desk){padding:0;}
.desk{display:flex;gap:0;align-items:stretch;min-height:0;height:100%;
  background:var(--surface);overflow:hidden;}
.desk-col{flex:0 0 var(--deskcol-w);min-width:0;max-height:calc(100vh - var(--deck-h));
  overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--steel-300);}
.desk-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:0;}
/* Inside one card the stacked parts are separated by the seam alone: a band
   is a ROW, not a card on a card; the room gets the card's padding; the
   pacing hangs off a single line at the foot. */
.desk-main > .band{margin:0;border:none;border-radius:0;background:none;
  border-bottom:1px solid var(--steel-200);padding:8px var(--hub-edge);}
/* The room's VIEWPORT: it takes the height that is left, clips whatever the
   pinch pushes past its edges, and keeps the gesture off the page's own
   scrolling (touch-action). It is a SIZE CONTAINER, so the drawing inside can
   be measured against it — see below. */
/* No padding here either: the status line above and the pacing below are the
   room's own edges, and the room carries its own walls. */
/* THE FLOOR IS THE WHOLE COLUMN. The room keeps its own shape — it is never
   warped — so when the column is wider than the room's ratio wants, there is
