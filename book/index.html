const publicHits = new Map(); // ip -> [ts]
function publicRateBlocked(req, res) {
  const ip = ipOf(req), now = Date.now();
  const arr = (publicHits.get(ip) || []).filter(t => now - t < 60 * 60000);
  if (arr.length >= 10) { res.status(429).json({ error: 'Too many bookings from this device. Please call us.' }); return true; }
  arr.push(now); publicHits.set(ip, arr);
  return false;
}
function refCode() { return 'B' + Math.random().toString(36).slice(2, 6).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase(); }

app.get('/api/public/info', (req, res) => {
  const data = readData(); const s = effectiveSettings(data);
  // Exceptions reach the guests' page as date, closed and note only — never
  // the window times, so /api/public/availability stays the one source for
  // times. Windowed to the horizon, and the array is capped at 120 on save.
  const today = av.localDay(new Date());
  const horizon = av.addDays(today, s.online.maxDaysAhead || 60);
  res.json({ venueName: s.venueName || 'Our restaurant', venueAddress: s.venueAddress, venuePhone: s.venuePhone, enabled: !!s.online.enabled, notifyList: !!s.online.notifyList, maxPartySize: s.online.maxPartySize, largerPartyMessage: s.online.largerPartyMessage, notesPrompt: s.online.notesPrompt, maxDaysAhead: s.online.maxDaysAhead, services: s.services, exceptions: (s.exceptions || []).filter(x => x.date >= today && x.date <= horizon).map(({ date, closed, note }) => ({ date, closed, note })), theme: data.theme });
});

app.get('/api/public/availability', (req, res) => {
  const data = readData(); const ctx = ctxOf(data); const s = ctx.settings;
  if (!s.online.enabled) return res.status(400).json({ error: 'Online bookings are off. Please call us.' });
  const day = String(req.query.date || '');
  const party = parseInt(req.query.party) || 2;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return res.status(400).json({ error: 'Pick a date' });
  if (party > s.online.maxPartySize) return res.status(400).json({ error: s.online.largerPartyMessage || 'Please call us for that many.' });
  const why = av.onlineDayReason(s, day);
  // A closed day needs nothing extra — `reason` already carries the note
  // ('Closed — Christmas Day'). A special-hours day carries it beside its times.
  if (why) return res.json({ date: day, party, slots: [], reason: why });
  const ex = av.exceptionOn(s, day);
  const slots = av.slotsFor(ctx, day, party, { online: true }).filter(x => x.ok || x.reason !== 'Past').map(x => ({ time: x.time, ok: x.ok }));
  res.json({ date: day, party, slots, note: (ex && !ex.closed && ex.note) || '' });
});

app.post('/api/public/book', (req, res) => {
  const data = readData(); const ctx = ctxOf(data); const s = ctx.settings;
  if (!s.online.enabled) return res.status(400).json({ error: 'Online bookings are off. Please call us.' });
  if (publicRateBlocked(req, res)) return;
  const b = req.body || {};
  const name = String(b.name || '').trim().slice(0, 60);
  const phone = String(b.phone || '').trim().slice(0, 30);
  const email = String(b.email || '').trim().slice(0, 80);
  const party = parseInt(b.partySize) || 0;
  const day = String(b.date || ''), hhmm = String(b.time || '');
  if (!name) return res.status(400).json({ error: 'Please tell us your name' });
  if (!phone) return res.status(400).json({ error: 'Please give us a phone number so we can reach you' });
  if (!(party >= 1)) return res.status(400).json({ error: 'How many people?' });
  if (party > s.online.maxPartySize) return res.status(400).json({ error: s.online.largerPartyMessage || 'Please call us for that many.' });
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !HHMM.test(hhmm)) return res.status(400).json({ error: 'Pick a date and time' });
  const dayWhy = av.onlineDayReason(s, day);
  if (dayWhy) return res.status(400).json({ error: dayWhy });
  const slot = av.slotsFor(ctx, day, party, { online: true }).find(x => x.time === hhmm);
  if (!slot) return res.status(400).json({ error: 'That time is not offered' });
  if (!slot.ok) return res.status(409).json({ error: 'That time has just gone. Pick another.' });
  const r = { id: newId('rv'), name, phone, email, partySize: party, time: av.joinTime(day, hhmm), durationMin: null, tableId: s.online.holdTables ? slot.tableId : null, tableIds: [], notes: pos.plainText(b.notes).trim().slice(0, 300), tags: [], setMenu: null, status: 'booked', source: 'online', ref: refCode(), createdAt: Date.now(), updatedAt: Date.now(), createdBy: 'Online' };
  // Online bookings hold a table anyway when the venue asked for it; otherwise
  // the day's best free table is still noted so the floor can see it coming.
  if (!r.tableId && slot.tableId) r.tableId = slot.tableId;
  const g = touchGuest(data, r);
  r.events = [history.createdEvent(r, 'Online', r.createdAt, evOpts(data))];
  data.reservations.push(r);
  // They got a table after all: take them off the notify list for that day.
  retireNotify(data, r, '', 'Online');
  recountGuest(data, g.id);
  logAudit(data, 'Online', `Online booking: ${r.name} (${r.partySize}, ${r.time})`);
  writeData(data);
  // Hand-built on purpose: returning the row itself would put staff names
  // (createdBy, and now every history line's actor) on the guests' page.
  res.json({ ok: true, ref: r.ref, name: r.name, partySize: r.partySize, time: r.time, venueName: s.venueName });
  kickPos();
});

// Guests join the notify list: not a booking, and the page says so. It shares
// the booking budget on purpose — one live entry per phone per day keeps a
// guest from spending it.
app.post('/api/public/notify', (req, res) => {
  const data = readData(), ctx = ctxOf(data), s = ctx.settings;
  if (!s.online.enabled) return res.status(400).json({ error: 'Online bookings are off. Please call us.' });
  if (!s.online.notifyList) return res.status(400).json({ error: 'The notify list is not open. Please call us.' });
  if (publicRateBlocked(req, res)) return;
  const b = req.body || {};
  const name = String(b.name || '').trim().slice(0, 60);
  const phone = String(b.phone || '').trim().slice(0, 30);
  const party = parseInt(b.partySize) || 0;
  const date = String(b.date || '');
  if (!name) return res.status(400).json({ error: 'Please tell us your name' });
  if (!phone) return res.status(400).json({ error: 'Please give us a phone number so we can reach you' });
  if (!(party >= 1)) return res.status(400).json({ error: 'How many people?' });
  if (party > s.online.maxPartySize) return res.status(400).json({ error: s.online.largerPartyMessage || 'Please call us for that many.' });
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return res.status(400).json({ error: 'Pick a date' });
  const dayWhy = av.onlineDayReason(s, date);
  if (dayWhy) return res.status(400).json({ error: dayWhy });
  if (!HHMM.test(String(b.from || '')) || !HHMM.test(String(b.to || ''))) return res.status(400).json({ error: 'Pick the earliest and latest time you would take' });
  let from = String(b.from), to = String(b.to);
  if (av.toMin(to) < av.toMin(from)) return res.status(400).json({ error: 'The latest time must not be before the earliest' });
  // Clamp onto the day's real service, so nobody joins a list for 3am.
  const slots = av.slotTimes(s, date);
  if (slots.length) {
    if (av.toMin(from) < av.toMin(slots[0])) from = slots[0];
    if (av.toMin(to) > av.toMin(slots[slots.length - 1])) to = slots[slots.length - 1];
    if (av.toMin(to) < av.toMin(from)) return res.status(400).json({ error: 'We are not open at those times' });
  }
  const today = tradingDay(data);
  const key = phoneKey(phone);
  if (data.notify.some(e => av.notifyLive(e, today) && e.date === date && phoneKey(e.phone) === key)) {
    return res.status(409).json({ error: 'You are already on our list for that day.' });
  }
  const e = {
    id: newId('nt'), ref: notifyRef(), name, phone, email: String(b.email || '').trim().slice(0, 80),
    partySize: party, date, from, to, wanted: wantedTime(s, date, from, to, b.wanted),
    notes: pos.plainText(b.notes).trim().slice(0, 200),
    source: 'online', status: 'waiting', createdAt: Date.now(), createdBy: 'Online',
    notifiedAt: null, bookedAt: null, bookingId: null,
  };
  data.notify.push(e);
  logAudit(data, 'Online', `Notify list: ${e.name} (${e.partySize}) for ${e.date} ${e.from}–${e.to}`);
  writeData(data);
  // Hand-built, like the booking reply: never another guest's data.
  res.json({ ok: true, ref: e.ref, name: e.name, partySize: e.partySize, date: e.date, from: e.from, to: e.to, venueName: s.venueName });
});

// The honest counterpart of "this is not a booking": they can take themselves
// off, with the reference we gave them.
app.post('/api/public/notify/:ref/remove', (req, res) => {
  const data = readData();
  const e = data.notify.find(x => x.ref && x.ref === String(req.params.ref).toUpperCase());
  if (!e) return res.status(404).json({ error: 'No notify entry with that reference' });
  if (e.status === 'booked') return res.status(400).json({ error: 'That is a booking now. Please call us to change it.' });
  if (e.status !== 'removed') {
    e.status = 'removed';
    logAudit(data, 'Online', `Notify list: ${e.name} took themselves off ${e.date}`);
    writeData(data);
  }
  res.json({ ok: true });
});

app.get('/api/public/booking/:ref', (req, res) => {
  const data = readData();

  if (!r) return res.status(404).json({ error: 'No booking with that reference' });

app.post('/api/public/booking/:ref/cancel', (req, res) => {
  const data = readData();
  const r = data.reservations.find(x => x.ref && x.ref === String(req.params.ref).toUpperCase());
  if (!r) return res.status(404).json({ error: 'No booking with that reference' });

  const before = Object.assign({}, r);
  const now = Date.now();
  r.status = 'cancelled'; r.cancelledAt = now; r.cancelReason = 'Cancelled by the guest online'; r.updatedAt = now;
  r.events = history.append(r.events, history.changeEvents(before, r, { by: 'Online', at: now }, evOpts(data)));
  raiseOpening(data, r, 'cancelled', 'Online');
  recountGuest(data, r.guestId);
  logAudit(data, 'Online', `Guest cancelled online: ${r.name} (${r.time})`);
  writeData(data);
  res.json({ ok: true });

// The run sheet: tonight on one page, for the desk and for the pass. A read
// and nothing else — a GET never writes, and nobody asked for a record of who
// printed what. The arithmetic is all in availability.js, so this route only
// picks the day and heads the paper; ctxOf() runs effectiveSettings(), so a
// linked venue's own name, sittings and service windows are already on it.
// Open on the wifi like /api/reservations and /api/today, deliberately: the

app.get('/api/run-sheet', (req, res) => {
  const data = readData();
  const day = String(req.query.date || tradingDay(data));

  const s = effectiveSettings(data);

app.get('/api/today', (req, res) => {
  const data = readData();
  const day = tradingDay(data);
  const rows = data.reservations.filter(r => av.dayOf(r.time) === day);
  const live = rows.filter(av.isLive);
  // The deck badge rides this poll. An opening with nobody to call is not an
  // alert, so the cheap match test runs first and openingOpen() — which walks
  // the bookings — only for openings that would actually be worth showing.
  const ctx = ctxOf(data);
  const waitingList = data.notify.filter(e => av.notifyLive(e, day));
  const openings = data.openings.filter(o => av.notifyMatches(waitingList, o).length > 0 && av.openingOpen(ctx, o)).length;
  // The room as it stands this minute, from the same function the floor plan
  // draws from: free tables, tables running over, and tables held by somebody
  // who has not sat down. It is the number a host looks up for.
  const floor = av.floorAt(ctx, day, av.hhmmOf(av.localTime(new Date())));
  const count = (st) => floor.filter(f => f.state === st).length;
  res.json({
    date: day, bookings: live.length, covers: live.reduce((n, r) => n + r.partySize, 0),
    seated: rows.filter(r => av.isSat(r)).length,
    done: rows.filter(r => r.status === 'done').length,
    waiting: (data.waitlist || []).filter(w => w.status !== 'left').length,
    noShows: rows.filter(r => r.status === 'no-show').length,
    notify: waitingList.length, openings,
    room: { tables: floor.length, free: count('free'), seated: count('seated'), over: count('over'), due: count('due'), check: count('check'), paid: count('paid') },
  });
});

// One pass: pull the venue's shape when the POS store moved, then mirror
// bookings both ways. Runs every few seconds, and right after any write.
let _posBusy = false, _posAgain = false, _posTimer = null;
async function posPass(force) {
  if (_posBusy) { _posAgain = true; return null; }
  _posBusy = true;
  let out = null;
  try {
    let data = readData();
    const cfg = data.settings.pos;
    if (!pos.ready(cfg)) { if (data.posState.connected) { data.posState.connected = false; writeData(data); } return null; }
    let version = null;
    try { version = await pos.getVersion(cfg); }
    catch (e) {
      data = readData();
      if (data.posState.connected || data.posState.lastError !== e.message) { data.posState.connected = false; data.posState.lastError = e.message; writeData(data); }
      return null;
    }
    const moved = force || !data.posState.version || data.posState.version.store !== version.store;
    if (moved) {
      const [floorPlans, settings, theme, combos] = await Promise.all([
        cfg.useFloor !== false ? pos.getFloorPlans(cfg).catch(() => null) : null,
        pos.getSettings(cfg).catch(() => null),
        pos.getTheme(cfg).catch(() => null),
        cfg.useMenus !== false ? pos.getCombos(cfg).catch(() => null) : null,
      ]);
      data = readData();
      if (Array.isArray(floorPlans) && floorPlans.length) data.floorPlans = floorPlans;
      if (settings) data.posSettings = { venueName: settings.venueName || '', venueAddress: settings.venueAddress || '', seatingMinutes: settings.seatingMinutes || null, dayStartsAt: settings.dayStartsAt, coversEnabled: !!settings.coversEnabled };
      if (theme && theme.accent) data.theme = { accent: theme.accent, mode: theme.mode || 'auto' };
      // Guarded: a POS that 404s /api/combos, or answers oddly, leaves the
      // last good list in place rather than wiping the picker.
      if (Array.isArray(combos)) data.posCombos = pos.menusFromCombos(combos);
      writeData(data);
    }
    // A cancellation made on the floor must reach the desk's notify list too.
    // sync.js learns nothing about any of this — the mirror stays about the
    // mirror — so the comparison is made here: live before the pass, not live
    // after it. The posState write below persists whatever this raises.
    const wasLive = new Set(readData().reservations.filter(av.isLive).map(x => x.id));
    out = await sync.run(cfg, (d, msg) => logAudit(d, 'POS', msg));
    data = readData();
    for (const r of data.reservations) if (wasLive.has(r.id) && ['cancelled', 'no-show'].includes(r.status)) raiseOpening(data, r, 'cancelled on the POS', 'POS');
    data.posState = Object.assign(data.posState, { connected: true, lastSyncAt: Date.now(), lastError: '', version, last: out });
    writeData(data);
  } catch (e) {
    const data = readData();
    data.posState.lastError = e.message; data.posState.connected = false;
    writeData(data);
  } finally {
    _posBusy = false;
    if (_posAgain) { _posAgain = false; setTimeout(() => posPass(false), 50); }
  }
  return out;
}
function kickPos() {
  const data = readData();
  if (!pos.ready(data.settings.pos)) return;
  clearTimeout(_posTimer);
  _posTimer = setTimeout(() => posPass(false), 300);
}
setInterval(() => posPass(false), 8000);
setTimeout(() => posPass(true), 500);

// Bookings whose time came and went with nobody arriving: nothing happens by

// ---------- backups ----------
const BACKUP_DIR = path.join(__dirname, 'data', 'backups');
function snapshot(prefix) {
  try { fs.mkdirSync(BACKUP_DIR, { recursive: true }); } catch (e) {}
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  const name = `${prefix || 'auto'}-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.json`;
  fs.writeFileSync(path.join(BACKUP_DIR, name), JSON.stringify(readData()));
  const all = fs.readdirSync(BACKUP_DIR).filter(f => f.endsWith('.json')).sort().reverse();
  for (const f of all.slice(30)) { try { fs.unlinkSync(path.join(BACKUP_DIR, f)); } catch (e) {} }
  return name;
}
function snapshotIfDue() {
  try {
    fs.mkdirSync(BACKUP_DIR, { recursive: true });
    const newest = fs.readdirSync(BACKUP_DIR).filter(f => f.endsWith('.json')).map(f => fs.statSync(path.join(BACKUP_DIR, f)).mtimeMs).sort((a, b) => b - a)[0];
    if (newest && Date.now() - newest < 12 * 3600000) return;
    console.log('Backup written: ' + snapshot('auto'));
  } catch (e) {}
}
// Read-time predicates already hide a dead entry or a spent opening; this is
// only so the file does not grow forever. A week's grace keeps yesterday's
// story readable in the audit log.
function tidyLists() {
  try {
    const data = readData();
    const cut = av.addDays(tradingDay(data), -7);
    const before = data.notify.length + data.openings.length;
    data.notify = data.notify.filter(e => String(e.date || '') >= cut);
    data.openings = data.openings.filter(o => String(o.date || '') >= cut);
    if (data.notify.length + data.openings.length !== before) writeData(data);
  } catch (e) {}
}
snapshotIfDue();
setInterval(() => { snapshotIfDue(); tidyLists(); }, 3600000);

  });
}

<script>// book.js — the guests' page. One column, four steps, no sign-in:
// how many, which day, what time, who you are. Everything it knows comes
// from /api/public/*, which never exposes other guests' bookings.
'use strict';

const st = { info: null, party: 2, date: '', slots: null, reason: '', note: '', time: '', name: '', phone: '', email: '', notes: '', error: '', busy: false, done: null, lookup: '', found: null,
  // The notify list — "tell me if something opens". Its name and phone are
  // deliberately NOT the booking form's, so a half-typed booking is never
  // silently reused as a notify entry.
  notifyOpen: false, notifyWanted: '', notifyFrom: '', notifyTo: '', notifyName: '', notifyPhone: '', notifyEmail: '', notifyNotes: '', notifyError: '', notifyDone: null };
const pad2 = (n) => String(n).padStart(2, '0');
const localDay = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const addDays = (day, n) => { const [y, m, d] = day.split('-').map(Number); return localDay(new Date(y, m - 1, d + n)); };
const parseDay = (day) => { const [y, m, d] = day.split('-').map(Number); return new Date(y, m - 1, d); };
const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmtHHMM = (hhmm) => { const d = new Date(); d.setHours(...hhmm.split(':').map(Number), 0, 0); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
const fmtWhen = (t) => new Date(t).toLocaleString([], { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
const fmtDayLong = (day) => parseDay(day).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
const toMin = (hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
function applyTheme(theme) {
  const t = theme || {};
  const mode = t.mode === 'auto' || !t.mode ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t.mode;
  document.body.dataset.theme = mode;
  if (t.accent && /^#[0-9A-Fa-f]{6}$/.test(t.accent)) document.documentElement.style.setProperty('--orange', t.accent);
}
// The days on offer, as { day, closed, note }. A dated exception replaces the
// weekly pattern — the mirror of availability.js's servicesOn(), which is
// server-only, so change the two in step. A date the venue has closed is kept
// in the list, struck through, when the weekday would normally be open, so a
// guest looking for the 25th sees WHY it is not on offer; a closed date on an
// already-shut weekday is simply absent, like every other shut weekday.
function openDays() {
  const weekly = new Set((st.info.services || []).flatMap(s => s.days || []));
  const exc = new Map((st.info.exceptions || []).map(x => [x.date, x]));
  const out = [], today = localDay(new Date());
  for (let i = 0; i < Math.min(st.info.maxDaysAhead || 60, 60); i++) {
    const d = addDays(today, i), ex = exc.get(d), weeklyOpen = weekly.has(parseDay(d).getDay());
    if (ex && ex.closed) { if (weeklyOpen) out.push({ day: d, closed: true, note: ex.note || '' }); }
    else if (ex || weeklyOpen) out.push({ day: d, closed: false, note: (ex && ex.note) || '' });
  }
  return out;
}
async function loadSlots() {
  st.slots = null; st.reason = ''; st.note = ''; st.time = ''; render();
  try { const r = await api(`/api/public/availability?date=${st.date}&party=${st.party}`); st.slots = r.slots; st.reason = r.reason || ''; st.note = r.note || ''; }
  catch (e) { st.slots = []; st.reason = e.message; }
  render();
}
// The slot the day offers nearest a minute-of-day, so "an hour either side"
// lands on real times and clamps to the first and last sitting.
function nearestSlot(min) {
  const times = (st.slots || []).map(x => x.time);
  if (!times.length) return '';
  return times.reduce((best, t) => (Math.abs(toMin(t) - min) < Math.abs(toMin(best) - min) ? t : best), times[0]);
}
// Opening the card: the time they tapped (or the middle of the day), then an
// hour either side, and whatever they have already typed into the booking form.
function openNotify(wanted) {
  const times = (st.slots || []).map(x => x.time);
  st.notifyWanted = wanted || st.time || (times.length ? times[Math.floor(times.length / 2)] : '');
  const w = toMin(st.notifyWanted);
  st.notifyFrom = nearestSlot(w - 60) || st.notifyWanted;
  st.notifyTo = nearestSlot(w + 60) || st.notifyWanted;
  if (toMin(st.notifyFrom) > w) st.notifyFrom = st.notifyWanted;
  if (toMin(st.notifyTo) < w) st.notifyTo = st.notifyWanted;
  if (!st.notifyName) st.notifyName = st.name;
  if (!st.notifyPhone) st.notifyPhone = st.phone;
  if (!st.notifyEmail) st.notifyEmail = st.email;
  st.notifyOpen = true; st.notifyError = '';
  render();
  setTimeout(() => { const n = document.getElementById('n-name'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
}
async function joinNotify() {
  st.notifyError = '';
  if (!st.notifyName.trim()) st.notifyError = 'Please tell us your name.';
  else if (!st.notifyPhone.trim()) st.notifyError = 'A phone number is the whole point — it is how we tell you.';
  else if (!st.date || !st.notifyFrom || !st.notifyTo) st.notifyError = 'Pick the earliest and the latest you would take.';
  else if (toMin(st.notifyTo) < toMin(st.notifyFrom)) st.notifyError = 'The latest must not be before the earliest.';
  if (st.notifyError) { render(); return; }
  st.busy = true; render();
  try {
    st.notifyDone = await api('/api/public/notify', { name: st.notifyName, phone: st.notifyPhone, email: st.notifyEmail, partySize: st.party, date: st.date, from: st.notifyFrom, to: st.notifyTo, wanted: st.notifyWanted, notes: st.notifyNotes });
    st.notifyOpen = false;
  } catch (e) { st.notifyError = e.message; }
  st.busy = false; render();
}
async function book() {
  st.error = '';
  if (!st.name.trim()) st.error = 'Please tell us your name.';
  else if (!st.phone.trim()) st.error = 'A phone number lets us reach you if anything changes.';
  else if (!st.date || !st.time) st.error = 'Pick a day and a time.';
  if (st.error) { render(); return; }
  st.busy = true; render();
  try { st.done = await api('/api/public/book', { name: st.name, phone: st.phone, email: st.email, partySize: st.party, date: st.date, time: st.time, notes: st.notes }); }
  catch (e) { st.error = e.message; if (e.message.indexOf('just gone') >= 0) loadSlots(); }
  st.busy = false; render();
}

function render() {
  const app = document.getElementById('app');
  const focus = document.activeElement && document.activeElement.id;
  if (!st.info) { app.innerHTML = '<div class="book"><div class="card"><div class="ts">Loading…</div></div></div>'; return; }
  const i = st.info;
  const head = `<div class="venue">${esc(i.venueName)}</div>`;
  if (!i.enabled) { app.innerHTML = `<div class="book">${head}<div class="card"><h1>Bookings by phone</h1><div class="ts" style="text-align:center;">Online bookings are not open right now.${i.venuePhone ? ` Please call <a href="tel:${esc(i.venuePhone)}">${esc(i.venuePhone)}</a>.` : ''}</div></div></div>`; return; }
  if (st.done) {
    const d = st.done;
    app.innerHTML = `<div class="book">${head}<div class="card done"><h1>See you soon, ${esc(d.name.split(' ')[0])}.</h1><div class="ts">${esc(fmtWhen(d.time))} · ${d.partySize} ${d.partySize === 1 ? 'guest' : 'guests'}</div><div class="field-label" style="margin-top:12px;">Your reference</div><div class="ref">${esc(d.ref)}</div><div class="ts">Keep it to cancel online. ${i.venuePhone ? 'Or call ' + esc(i.venuePhone) + '.' : ''}</div><button class="btn" data-act="again" style="margin-top:12px;">Make another booking</button></div>${i.venueAddress ? `<div class="foot">${esc(i.venueAddress)}</div>` : ''}</div>`;
    return;
  }
  // On the list, not booked — and it says so twice, because the difference is
  // the whole point.
  if (st.notifyDone) {
    const d = st.notifyDone;
    app.innerHTML = `<div class="book">${head}<div class="card done">
      ${d.removed ? `<h1>You're off the list.</h1><div class="ts">We will not call about ${esc(fmtDayLong(d.date))}.</div>`
      : `<h1>You're on the list, ${esc(String(d.name || '').split(' ')[0])}.</h1>
        <div class="ts">${esc(fmtDayLong(d.date))} · ${d.partySize} ${d.partySize === 1 ? 'guest' : 'guests'} · between ${esc(fmtHHMM(d.from))} and ${esc(fmtHHMM(d.to))}</div>
        <div class="field-label" style="margin-top:12px;">Your reference</div><div class="ref">${esc(d.ref)}</div>
        <div class="ts">This is not a booking. We will call you if a table opens, and there is nothing to do if we do not.${i.venuePhone ? ' Our number is ' + esc(i.venuePhone) + '.' : ''}</div>
        ${st.notifyError ? `<div class="err" style="color:var(--red);font-weight:700;">${esc(st.notifyError)}</div>` : ''}
        <button class="btn" data-act="notify-off" style="margin-top:12px;" ${st.busy ? 'disabled' : ''}>Take me off the list</button>`}
      <button class="btn" data-act="again" style="margin-top:8px;">Back to booking</button>
    </div>${i.venueAddress ? `<div class="foot">${esc(i.venueAddress)}</div>` : ''}</div>`;
    return;
  }
  const days = openDays();
  const anyOk = (st.slots || []).some(x => x.ok);
  // Somebody has to say it is not a booking, and it has to be the loudest line
  // on the card that offers it.
  const notifyCta = i.notifyList && st.date && !st.reason && st.slots !== null && st.party !== 'more'
    ? (anyOk
      ? `<div class="ts" style="margin-top:8px;">Not the time you wanted?</div><button class="btn" data-act="notify-open">Tell me if something opens</button>`
      : `<button class="btn go" data-act="notify-open" style="margin-top:8px;min-height:56px;">Tell me if something opens</button>`)
    : '';
  const notifyCard = i.notifyList && st.notifyOpen && st.date && st.party !== 'more' ? `<div class="card">
    <div class="field-label">Tell me if something opens</div>
    <div class="ts">This is not a booking. It puts you on our list for ${esc(fmtDayLong(st.date))}. If a table frees up we will call you — we offer it to whoever asked for the closest time, and to whoever has waited longest.</div>
    <div class="field-label">Earliest you would take</div>
    <div class="slots">${(st.slots || []).map(x => `<button class="chip${st.notifyFrom === x.time ? ' active' : ''}" data-act="notify-from" data-val="${x.time}">${esc(fmtHHMM(x.time))}</button>`).join('') || '<div class="ts">No times that day.</div>'}</div>
    <div class="field-label">Latest you would take</div>
    <div class="slots">${(st.slots || []).map(x => `<button class="chip${st.notifyTo === x.time ? ' active' : ''}" data-act="notify-to" data-val="${x.time}">${esc(fmtHHMM(x.time))}</button>`).join('') || '<div class="ts">No times that day.</div>'}</div>
    <label class="field-label" for="n-name">Your name</label><input id="n-name" type="text" value="${esc(st.notifyName)}" data-field="notifyName" autocomplete="name">
    <label class="field-label" for="n-phone">Phone</label><input id="n-phone" type="tel" value="${esc(st.notifyPhone)}" data-field="notifyPhone" autocomplete="tel">
    <label class="field-label" for="n-email">Email (optional)</label><input id="n-email" type="email" value="${esc(st.notifyEmail)}" data-field="notifyEmail" autocomplete="email">
    <label class="field-label" for="n-notes">Anything we should know? (optional)</label><textarea id="n-notes" data-field="notifyNotes">${esc(st.notifyNotes)}</textarea>
    ${st.notifyError ? `<div class="err" style="color:var(--red);font-weight:700;margin-top:8px;">${esc(st.notifyError)}</div>` : ''}
    <button class="btn go" data-act="notify-send" style="margin-top:12px;min-height:56px;" ${st.busy ? 'disabled' : ''}>Add me to the list for ${st.party} on ${esc(fmtDayLong(st.date))}</button>
  </div>` : '';
  app.innerHTML = `<div class="book">
    ${head}
    <h1>Book a table</h1>
    <div class="card">
      <div class="field-label">How many?</div>
      <div class="chips">${Array.from({ length: i.maxPartySize }, (_, k) => k + 1).map(n => `<button class="chip${st.party === n ? ' active' : ''}" data-act="party" data-val="${n}">${n}</button>`).join('')}<button class="chip" data-act="party" data-val="more">More</button></div>
      ${st.party === 'more' ? `<div class="ts" style="margin-top:8px;">${esc(i.largerPartyMessage)}${i.venuePhone ? ` <a href="tel:${esc(i.venuePhone)}">${esc(i.venuePhone)}</a>` : ''}</div>` : ''}
    </div>
    ${st.party !== 'more' ? `<div class="card">
      <div class="field-label">Which day?</div>
      <div class="dates">${days.map(o => { const dt = parseDay(o.day); return `<button class="chip${st.date === o.day ? ' active' : ''}${o.closed && st.date !== o.day ? ' off' : ''}" data-act="date" data-val="${o.day}"${o.note ? ` title="${esc(o.note)}"` : ''}><small>${esc(dt.toLocaleDateString([], { weekday: 'short' }))}</small><span>${dt.getDate()}</span><small>${esc(dt.toLocaleDateString([], { month: 'short' }))}</small></button>`; }).join('')}</div>
      ${st.date ? `<div class="field-label">What time?</div>${st.slots === null ? '<div class="ts">Checking…</div>' : st.reason ? `<div class="ts">${esc(st.reason)}</div>` : `${st.note ? `<div class="ts">${esc(st.note)}</div>` : ''}${st.slots.length ? `<div class="slots">${st.slots.map(s => `<button class="chip${st.time === s.time ? ' active' : ''}${!s.ok ? ' off' : ''}" data-act="${s.ok || !i.notifyList ? 'time' : 'notify-want'}" data-val="${s.time}" ${s.ok || i.notifyList ? '' : 'disabled'}>${esc(fmtHHMM(s.time))}</button>`).join('')}</div>` : ''}${anyOk ? '' : '<div class="ts">Nothing free that day, sorry.</div>'}${notifyCta}`}` : ''}
    </div>${notifyCard}` : ''}
    ${st.time ? `<div class="card">
      <label class="field-label" for="b-name">Your name</label><input id="b-name" type="text" value="${esc(st.name)}" data-field="name" autocomplete="name">
      <label class="field-label" for="b-phone">Phone</label><input id="b-phone" type="tel" value="${esc(st.phone)}" data-field="phone" autocomplete="tel">
      <label class="field-label" for="b-email">Email (optional)</label><input id="b-email" type="email" value="${esc(st.email)}" data-field="email" autocomplete="email">
      <label class="field-label" for="b-notes">${esc(i.notesPrompt || 'Anything we should know?')}</label><textarea id="b-notes" data-field="notes">${esc(st.notes)}</textarea>
      ${st.error ? `<div class="err" style="color:var(--red);font-weight:700;margin-top:8px;">${esc(st.error)}</div>` : ''}
      <button class="btn go" data-act="book" style="margin-top:12px;min-height:56px;" ${st.busy ? 'disabled' : ''}>Book ${st.party} for ${esc(fmtHHMM(st.time))} on ${esc(parseDay(st.date).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }))}</button>
    </div>` : ''}
    <div class="card">
      <div class="field-label">Already booked?</div>
      <div class="inline"><input type="text" id="b-ref" placeholder="Reference, e.g. BX7K2A" value="${esc(st.lookup)}" data-field="lookup" style="flex:1;text-transform:uppercase;" autocomplete="off"><button class="btn" data-act="lookup">Find</button></div>
      ${st.found ? (st.found.error ? `<div class="ts">${esc(st.found.error)}</div>` : `<div class="ts">${esc(st.found.name)} · ${esc(fmtWhen(st.found.time))} · ${st.found.partySize} guests · ${esc(st.found.status)}</div>${['booked', 'confirmed'].includes(st.found.status) ? `<button class="btn danger" data-act="cancel">Cancel this booking</button>` : ''}`) : ''}
    </div>
    <div class="foot">${esc(i.venueAddress || '')}${i.venuePhone ? (i.venueAddress ? ' · ' : '') + esc(i.venuePhone) : ''}</div>
  </div>`;
  if (focus) { const el = document.getElementById(focus); if (el) el.focus(); }
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, val = el.dataset.val;
  try {
    if (act === 'party') { st.party = val === 'more' ? 'more' : parseInt(val); st.time = ''; st.notifyOpen = false; render(); if (st.date && st.party !== 'more') loadSlots(); }
    else if (act === 'date') { st.date = val; st.notifyOpen = false; loadSlots(); }
    else if (act === 'time') { st.time = val; render(); setTimeout(() => { const n = document.getElementById('b-name'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50); }
    else if (act === 'book') book();
    // Tapping a time that has gone is exactly the moment to offer the list.
    else if (act === 'notify-want') openNotify(val);
    else if (act === 'notify-open') openNotify('');
    else if (act === 'notify-from') { st.notifyFrom = val; if (toMin(st.notifyTo) < toMin(val)) st.notifyTo = val; render(); }
    else if (act === 'notify-to') { st.notifyTo = val; if (toMin(st.notifyFrom) > toMin(val)) st.notifyFrom = val; render(); }
    else if (act === 'notify-send') joinNotify();
    else if (act === 'notify-off') {
      if (!confirm('Take yourself off the list? We will not call about that day.')) return;
      st.busy = true; render();
      try { st.notifyError = ''; await api('/api/public/notify/' + encodeURIComponent(st.notifyDone.ref) + '/remove', {}); st.notifyDone = Object.assign({}, st.notifyDone, { removed: true }); }
      catch (e) { st.notifyError = e.message; }
      st.busy = false; render();
    }
    else if (act === 'again') { st.done = null; st.notifyDone = null; st.notifyOpen = false; st.notifyError = ''; st.time = ''; st.slots = null; st.date = ''; st.reason = ''; st.note = ''; render(); }
    else if (act === 'lookup') { try { st.found = await api('/api/public/booking/' + encodeURIComponent(st.lookup.trim().toUpperCase())); } catch (e) { st.found = { error: e.message }; } render(); }
    else if (act === 'cancel') { if (!confirm('Cancel this booking?')) return; await api('/api/public/booking/' + encodeURIComponent(st.found.ref) + '/cancel', {}); st.found = Object.assign({}, st.found, { status: 'cancelled' }); render(); }
  } catch (e) { st.error = e.message; render(); }
});
document.addEventListener('input', (ev) => { const f = ev.target.dataset && ev.target.dataset.field; if (f) st[f] = ev.target.value; });

(async function boot() {
  try { st.info = await api('/api/public/info'); applyTheme(st.info.theme); }
  catch (e) { st.info = { venueName: '', enabled: false, notifyList: false, services: [], exceptions: [] }; }
  render();
})();
</script>
