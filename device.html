<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservations on a device</title>
<style>
  :root{ --bar:#17191B; --bar-2:#2A2E31; --ink:#E9ECEF; --dim:#9AA3A9;
    --pick:#3692E7; --pick-bg:#0F2233; --line:#34393D; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bar);color:var(--ink);overflow:hidden;
    font:600 14px/1.3 -apple-system,system-ui,'Segoe UI',sans-serif;
    display:flex;flex-direction:column;}

  .stage{flex:1;min-height:0;display:grid;place-items:center;background:var(--bar);}
  /* A scaled element still reserves its UNSCALED box, so the screen used to
     spill over the buttons. The sizer holds the scaled size; the screen is
     scaled from its top-left corner inside it. */
  .fit{overflow:hidden;}
  .screen{position:relative;overflow:hidden;background:#fff;transform-origin:top left;}
  .screen iframe{display:block;border:0;width:100%;height:100%;}
  .ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
    border:2px solid rgba(54,146,231,.9);background:rgba(54,146,231,.16);
    pointer-events:none;opacity:0;z-index:4;}
  .ring.on{opacity:1;}

  .keys{flex:none;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);background:var(--bar);}
  button{display:inline-flex;align-items:center;justify-content:center;gap:9px;
    min-height:52px;padding:0 20px;border-radius:12px;cursor:pointer;
    border:1px solid var(--line);background:var(--bar-2);color:var(--ink);
    font:600 15px/1 inherit;}
  button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;}
  button.on{background:var(--pick-bg);border-color:var(--pick);color:var(--pick);}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="fit" id="fit">
      <div class="screen" id="screen">
        <iframe id="app" title="Reservations" src="index.html"></iframe>
        <div class="ring" id="ring"></div>
      </div>
    </div>
  </div>

  <div class="keys">
    <button id="phone" data-id="phone">
      <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10.6 5.2h2.8"/></svg>
      Phone
    </button>
    <button id="tablet" data-id="tablet">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.4"/><path d="M19.2 10.6v2.8"/></svg>
      Tablet
    </button>
    <button id="latest">
      <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1L21 8"/><path d="M21 3.5V8h-4.5"/><path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1L3 16"/><path d="M3 20.5V16h4.5"/></svg>
      Get latest
    </button>
    <button id="touch">
      <svg viewBox="0 0 24 24"><path d="M9 11V5.4a1.9 1.9 0 0 1 3.8 0V11"/><path d="M12.8 11V9.2a1.7 1.7 0 0 1 3.4 0V13"/><path d="M16.2 11.4a1.7 1.7 0 0 1 3.4 0v3.1c0 3.8-2.6 6.4-6.2 6.4-3 0-4.6-1.4-6.2-4L5 13.4a1.8 1.8 0 0 1 2.9-2.1L9 12.8"/></svg>
      Touch
    </button>
    <button id="pinch">
      <svg viewBox="0 0 24 24"><path d="M14.5 9.5 21 3"/><path d="M15.5 3H21v5.5"/><path d="M9.5 14.5 3 21"/><path d="M8.5 21H3v-5.5"/></svg>
      Pinch
    </button>
  </div>

<script>
(function () {
  'use strict';
  // CSS pixels, which is what a layout sees. Phone upright, tablet on its side.
  var SIZES = { phone: [393, 852], tablet: [1180, 820] };
  var $ = function (id) { return document.getElementById(id); };
  var m = /[?&]d=(phone|tablet)/.exec(location.search);
  var st = {
    id: m ? m[1] : (function () {
      try { var s = localStorage.getItem('resv-device'); if (SIZES[s]) return s; } catch (e) {}
      return 'phone';
    })(),
    touch: false,   // the frame answers a finger, not a mouse
    pinch: false,   // and can be zoomed and pushed about, the way a phone is
    zoom: 1, panX: 0, panY: 0
  };
  var base = 1;     // the scale that fits the window; zoom multiplies it

  function draw() {
    var s = SIZES[st.id], w = s[0], h = s[1];
    var stage = $('stage'), el = $('screen'), fit = $('fit');
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    base = Math.min(stage.clientWidth / w, stage.clientHeight / h);
    fit.style.width = Math.round(w * base) + 'px';
    fit.style.height = Math.round(h * base) + 'px';
    clampPan();
    el.style.transform = 'translate(' + st.panX.toFixed(1) + 'px,' + st.panY.toFixed(1) + 'px) scale('
      + (base * st.zoom).toFixed(4) + ')';
    $('phone').classList.toggle('on', st.id === 'phone');
    $('tablet').classList.toggle('on', st.id === 'tablet');
    $('touch').classList.toggle('on', st.touch);
    $('pinch').classList.toggle('on', st.pinch);
    try { localStorage.setItem('resv-device', st.id); } catch (e) {}
  }
  // Zoomed in, a phone lets you push the picture about but not off the edge.
  function clampPan() {
    var s = SIZES[st.id];
    var over = function (n) { return Math.max(0, n * base * (st.zoom - 1)); };
    var mx = over(s[0]), my = over(s[1]);
    st.panX = Math.min(0, Math.max(-mx, st.panX));
    st.panY = Math.min(0, Math.max(-my, st.panY));
  }
  // Zoom about the point under the finger, the way a pinch does.
  function zoomAt(k, cx, cy) {
    var was = st.zoom;
    st.zoom = Math.max(1, Math.min(6, st.zoom * k));
    if (st.zoom === was) return;
    var r = $('fit').getBoundingClientRect();
    var x = cx - r.left, y = cy - r.top;
    var f = st.zoom / was;
    st.panX = x - f * (x - st.panX);
    st.panY = y - f * (y - st.panY);
    draw();
  }

  function frameDoc() { try { return $('app').contentDocument; } catch (e) { return null; } }
  function frameWin() { try { return $('app').contentWindow; } catch (e) { return null; } }

  // ── TOUCH. Not a picture of a finger: the frame is sent real touch events,
  //    so anything that listens for them runs, hover is switched off because a
  //    touchscreen has none, and text stops selecting on a drag the way it
  //    does not on a phone. The ring is 44 across — the finger law — so you
  //    can see what a thumb actually covers.
  var TOUCH_CSS = '*{cursor:none!important;-webkit-user-select:none!important;user-select:none!important;}'
    + '.chip:hover,.btn:hover,.row:hover,.bk-row:hover,.bl-main:hover,'
    + '.rail-btn:hover,.deck-sq:hover,.deck-date:hover,.staff-badge:hover,'
    + '.bk-row:hover,.colour-swatch:hover{background:inherit;}';
  function applyTouch() {
    var doc = frameDoc(); if (!doc || !doc.head) return;
    var tag = doc.getElementById('pv-touch');
    if (st.touch && !tag) {
      tag = doc.createElement('style'); tag.id = 'pv-touch'; tag.textContent = TOUCH_CSS;
      doc.head.appendChild(tag);
    } else if (!st.touch && tag) { tag.remove(); }
    if (!st.touch) $('ring').classList.remove('on');
  }
  var idSeq = 1;
  function sendTouch(type, e, target) {
    var win = frameWin(); if (!win || !win.Touch || !win.TouchEvent) return;
    try {
      var t = new win.Touch({
        identifier: idSeq, target: target, clientX: e.clientX, clientY: e.clientY,
        pageX: e.pageX, pageY: e.pageY, screenX: e.screenX, screenY: e.screenY,
        radiusX: 22, radiusY: 22, rotationAngle: 0, force: 1
      });
      var live = type === 'touchend' || type === 'touchcancel' ? [] : [t];
      target.dispatchEvent(new win.TouchEvent(type, {
        touches: live, targetTouches: live, changedTouches: [t],
        bubbles: true, cancelable: true, view: win
      }));
    } catch (err) {}
  }

  // ── PINCH. A trackpad pinch or the wheel zooms about the point under the
  //    cursor; dragging pushes the picture about. A drag that never moves is
  //    still a tap, so the app underneath keeps working while zoomed in.
  var PAN_SLOP = 6;
  var drag = null;

  function wire() {
    var doc = frameDoc(); if (!doc || !doc.body || doc.__wired) return;
    doc.__wired = true;
    var ring = $('ring');

    doc.addEventListener('pointerdown', function (e) {
      if (st.touch) {
        ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
        ring.classList.add('on');
        sendTouch('touchstart', e, e.target);
      }
      if (st.pinch && st.zoom > 1) {
        drag = { x: e.clientX, y: e.clientY, px: st.panX, py: st.panY, moved: false, id: e.pointerId };
      }
    }, true);

    doc.addEventListener('pointermove', function (e) {
      if (st.touch) {
        ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
        ring.classList.add('on');
        if (drag || e.buttons) sendTouch('touchmove', e, e.target);
      }
      if (!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < PAN_SLOP) return;
      drag.moved = true;
      // The frame is scaled, so a pointer delta inside it is already in the
      // frame's own pixels: multiply back up to the page's.
      st.panX = drag.px + dx * base * st.zoom;
      st.panY = drag.py + dy * base * st.zoom;
      draw();
      e.preventDefault(); e.stopPropagation();
    }, true);

    var up = function (e) {
      if (st.touch) sendTouch('touchend', e, e.target);
      if (drag && drag.moved) { e.preventDefault(); e.stopPropagation(); }
      drag = null;
    };
    doc.addEventListener('pointerup', up, true);
    doc.addEventListener('pointercancel', up, true);
    // A pan must not land as a tap on whatever was under the finger.
    doc.addEventListener('click', function (e) {
      if (drag && drag.moved) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    doc.addEventListener('pointerleave', function () { ring.classList.remove('on'); }, true);

    // A gesture over the screen goes into the frame and never reaches this
    // page, so the frame hands it back.
    doc.addEventListener('wheel', function (e) {
      if (!st.pinch) return;
      e.preventDefault();
      var r = $('app').getBoundingClientRect();
      zoomAt(Math.exp(-e.deltaY / 700), r.left + e.clientX * base * st.zoom + st.panX,
                                        r.top + e.clientY * base * st.zoom + st.panY);
    }, { passive: false, capture: true });

    applyTouch();
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.id) { st.id = b.dataset.id; st.zoom = 1; st.panX = st.panY = 0; draw(); return; }
    if (b.id === 'latest') { st.zoom = 1; st.panX = st.panY = 0; frameWin().location.reload(true); draw(); return; }
    if (b.id === 'touch') { st.touch = !st.touch; applyTouch(); draw(); return; }
    if (b.id === 'pinch') {
      st.pinch = !st.pinch;
      if (!st.pinch) { st.zoom = 1; st.panX = st.panY = 0; }
      draw(); return;
    }
  });
  // The same gesture, when the cursor is beside the screen rather than on it.
  $('stage').addEventListener('wheel', function (e) {
    if (!st.pinch) return;
    e.preventDefault();
    zoomAt(Math.exp(-e.deltaY / 700), e.clientX, e.clientY);
  }, { passive: false });

  $('app').addEventListener('load', function () { wire(); applyTouch(); });
  window.addEventListener('resize', draw);
  draw(); wire();
})();
</script>
</body>
</html>
