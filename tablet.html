<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On a tablet — Reservations preview</title>
<style>
  /* The POS's own tokens, the few this page needs. It is the frame around the
     app, not the app, so it carries nothing else. */
  :root{
    --steel-100:#E9E6DF; --steel-200:#E2DED7; --steel-300:#D3CFC6; --steel-500:#B3ADA0;
    --charcoal:#23211D; --charcoal-soft:#918E88; --surface:#FFFFFF;
    --text:#38352F; --accent:#2F74C9;
    --font:'Noto Sans',-apple-system,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){ :root{
    --steel-100:#161512; --steel-200:#332F2B; --steel-300:#4A463F; --steel-500:#6B645A;
    --charcoal:#2B2926; --charcoal-soft:#D9D5CE; --surface:#2B2824;
    --text:#EAE8E4; --accent:#3692E7;
  } }
  @font-face{font-family:'Noto Sans';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/notosans-var.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/plexmono-700.woff2') format('woff2');}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--steel-100);color:var(--text);font-family:var(--font);font-size:13.5px;
    display:flex;flex-direction:column;overflow:hidden;}

  .bar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:8px 16px;min-height:60px;background:var(--surface);
    border-bottom:1px solid var(--steel-300);}
  .bar b{font-size:15px;font-weight:800;letter-spacing:-.2px;margin-right:4px;}
  .bar .sp{flex:1;}
  .chip{height:44px;padding:0 14px;border:1px solid var(--steel-300);border-radius:8px;
    background:var(--surface);color:var(--text);font:700 13.5px var(--font);cursor:pointer;
    white-space:nowrap;}
  .chip:hover{background:var(--steel-200);}
  .chip.on{background:var(--charcoal);border-color:var(--charcoal);color:#fff;}
  .chip.sq{width:44px;padding:0;display:inline-grid;place-items:center;}
  .chip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .size{font-family:var(--mono);font-weight:700;color:var(--charcoal-soft);white-space:nowrap;}
  a.chip{display:inline-grid;place-items:center;text-decoration:none;}

  .stage{flex:1;min-height:0;display:grid;place-items:center;padding:20px;overflow:auto;}
  /* The bezel. A device is a black slab with a screen in it and, on a phone,
     a home bar at the foot — three details, because a fourth starts to look
     like a drawing of a phone rather than a frame around the app. */
  .device{position:relative;background:#111315;border-radius:var(--bez-r,44px);
    padding:var(--bez,12px);box-shadow:0 18px 50px rgba(0,0,0,.28),0 2px 0 rgba(255,255,255,.08) inset;
    transform-origin:top center;}
  .screen{position:relative;overflow:hidden;background:#000;border-radius:calc(var(--bez-r,44px) - var(--bez,12px));}
  .screen iframe{display:block;border:0;background:var(--surface);}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:118px;height:26px;background:#111315;border-radius:0 0 16px 16px;z-index:3;pointer-events:none;}
  .homebar{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
    width:36%;height:4px;border-radius:2px;background:rgba(255,255,255,.55);z-index:3;pointer-events:none;}
  .device.tablet .notch{display:none;}
  .device.tablet .homebar{width:22%;}

  .note{flex:none;padding:8px 16px 12px;color:var(--charcoal-soft);font-size:11px;line-height:1.6;
    border-top:1px solid var(--steel-300);background:var(--surface);}
  .note code{font-family:var(--mono);}
  @media (max-width:760px){
    .bar{padding:8px 12px;}
    .bar b{flex:1 0 100%;}
    .stage{padding:10px;}
  }
</style>
</head>
<body>
  <div class="bar">
    <b>Reservations on a device</b>
    <span id="picks"></span>
    <button class="chip sq" id="rotate" title="Rotate" aria-label="Rotate">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
    </button>
    <span class="sp"></span>
    <span class="size" id="size"></span>
    <button class="chip" id="which">The desk</button>
    <a class="chip" id="full" href="index.html" target="_blank" rel="noopener">Full window</a>
  </div>

  <div class="stage" id="stage">
    <div class="device" id="device">
      <div class="notch"></div>
      <div class="screen" id="screen"><iframe id="app" title="Reservations"></iframe></div>
      <div class="homebar"></div>
    </div>
  </div>

  <div class="note">
    The real app, running in a frame the size of the real screen — the same
    code the full-window preview runs, sharing the same data. Book on one and
    it is on the other. Sign-in is gone; <code>Settings</code> asks for the
    manager PIN <code>1234</code>.
  </div>

<script>
(function () {
  'use strict';
  // CSS pixels, which is what a layout actually sees — not the marketing
  // resolution. A phone that says 1179 across is 393 to a stylesheet.
  var DEVICES = [
    { id: 'se',     name: 'iPhone SE',  w: 375,  h: 667,  bez: 14, r: 42, kind: 'phone' },
    { id: 'phone',  name: 'iPhone',     w: 393,  h: 852,  bez: 12, r: 48, kind: 'phone' },
    { id: 'max',    name: 'iPhone Max', w: 430,  h: 932,  bez: 12, r: 52, kind: 'phone' },
    { id: 'mini',   name: 'iPad mini',  w: 744,  h: 1133, bez: 16, r: 34, kind: 'tablet' },
    { id: 'ipad',   name: 'iPad',       w: 820,  h: 1180, bez: 18, r: 36, kind: 'tablet' },
    { id: 'pro',    name: 'iPad Pro',   w: 1024, h: 1366, bez: 18, r: 38, kind: 'tablet' }
  ];
  var KIND = 'tablet';
  var st = {
    id: (function () {
      try { var s = localStorage.getItem('resv-device'); if (s && DEVICES.some(function (d) { return d.id === s; })) return s; } catch (e) {}
      return KIND === 'tablet' ? 'ipad' : 'phone';
    })(),
    land: false,
    book: false
  };
  var $ = function (id) { return document.getElementById(id); };
  var dev = function () { return DEVICES.filter(function (d) { return d.id === st.id; })[0] || DEVICES[1]; };

  function picks() {
    $('picks').innerHTML = DEVICES.map(function (d) {
      return '<button class="chip' + (d.id === st.id ? ' on' : '') + '" data-id="' + d.id + '">' + d.name + '</button>';
    }).join('');
  }

  function draw() {
    var d = dev();
    var w = st.land ? d.h : d.w, h = st.land ? d.w : d.h;
    var el = $('device'), screen = $('screen'), frame = $('app');
    el.className = 'device' + (d.kind === 'tablet' ? ' tablet' : '');
    el.style.setProperty('--bez', d.bez + 'px');
    el.style.setProperty('--bez-r', (st.land && d.kind === 'phone' ? d.r : d.r) + 'px');
    screen.style.width = w + 'px';
    screen.style.height = h + 'px';
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';

    // Shrink to fit the window rather than scrolling: the whole point is
    // seeing the WHOLE screen at once. Never scaled up past life size.
    var stage = $('stage');
    var pad = 40;
    var availW = stage.clientWidth - pad, availH = stage.clientHeight - pad;
    var boxW = w + d.bez * 2, boxH = h + d.bez * 2;
    var k = Math.min(1, availW / boxW, availH / boxH);
    el.style.transform = 'scale(' + k.toFixed(4) + ')';
    // A scaled element still reserves its unscaled box, so the grid centres it
    // on the wrong size and the tall ones sit half off the bottom.
    el.style.marginBottom = Math.round(-(boxH * (1 - k))) + 'px';

    $('size').textContent = w + ' × ' + h + (k < 1 ? '  ·  ' + Math.round(k * 100) + '%' : '');
    $('which').textContent = st.book ? 'Guests’ page' : 'The desk';
    var src = st.book ? 'book/index.html' : 'index.html';
    if (frame.getAttribute('data-src') !== src) { frame.setAttribute('data-src', src); frame.src = src; }
    $('full').href = src;
    try { localStorage.setItem('resv-device', st.id); } catch (e) {}
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-id]');
    if (b) { st.id = b.getAttribute('data-id'); picks(); draw(); return; }
    if (ev.target.closest('#rotate')) { st.land = !st.land; draw(); return; }
    if (ev.target.closest('#which')) { st.book = !st.book; draw(); return; }
  });
  window.addEventListener('resize', draw);
  picks(); draw();
})();
</script>
</body>
</html>
